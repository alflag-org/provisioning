---
- name: Verify an external monitoring backup in an isolated database
  hosts: svc_zabbix_server
  gather_facts: false
  tasks:
    - name: Require an explicitly selected backup
      ansible.builtin.assert:
        that:
          - zabbix_restore_backup | default('') | length > 0

    - name: Bound restore validation and its descendants
      ansible.builtin.command:
        argv:
          - systemd-run
          - --wait
          - --collect
          - --pipe
          - --property=RuntimeMaxSec=1800
          - --property=KillMode=control-group
          - /usr/local/sbin/zabbix-recovery
          - restore-test
          - --backup
          - "{{ zabbix_restore_backup }}"
      changed_when: true
      when: not ansible_check_mode
