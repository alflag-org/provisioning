---
- name: Register declared network reachability checks without changing devices
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  connection: ansible.netcommon.httpapi
  vars:
    ansible_become: false
    ansible_network_os: community.zabbix.zabbix
    ansible_user: Admin
    ansible_httpapi_pass: "{{ zabbix_admin_password }}"
    ansible_httpapi_port: 80
    ansible_httpapi_use_ssl: false
    ansible_zabbix_url_path: ""
  tasks:
    - name: Synchronize network targets using the existing registration role
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: remote.yml
      vars:
        zabbix_target: "{{ zabbix_network_target }}"
      loop: "{{ groups['zabbix_network_devices'] | sort }}"
      loop_control:
        loop_var: zabbix_network_target
