---
- name: Configure MySQL Router service and listener observations
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  connection: ansible.netcommon.httpapi
  vars:
    ansible_become: false
    ansible_network_os: community.zabbix.zabbix
    ansible_user: Admin
    ansible_httpapi_pass: "{{ zabbix_admin_password }}"
    ansible_httpapi_port: 80
    ansible_httpapi_use_ssl: false
    ansible_zabbix_url_path: ""
  tasks:
    - name: Observe only existing enrolled Router client hosts
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: mysql-router.yml
      loop: "{{ groups['mysql_router_clients'] | intersect(groups['svc_zabbix_agent']) | sort }}"
      loop_control:
        loop_var: zabbix_target
