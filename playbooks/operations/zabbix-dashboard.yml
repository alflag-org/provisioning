---
- name: Configure the inventory-managed monitoring dashboard
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  vars:
    ansible_become: false
  tasks:
    - name: Apply the dashboard without changing collection or thresholds
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: dashboard.yml
