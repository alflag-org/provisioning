---
- name: Configure ReplicaSet backup monitoring independently of SQL credentials
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  connection: ansible.netcommon.httpapi
  vars:
    ansible_become: false
    ansible_network_os: community.zabbix.zabbix
    ansible_user: Admin
    ansible_httpapi_pass: "{{ zabbix_admin_password }}"
    ansible_httpapi_port: 80
    ansible_httpapi_use_ssl: false
    ansible_zabbix_url_path: ""
  tasks:
    - name: Register declared per-member backup evidence
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: mysql-backup.yml
      loop: "{{ groups['svc_mysql'] | sort }}"
      loop_control:
        loop_var: zabbix_target
      when: hostvars[zabbix_target].mysql_backup_enabled | default(false) | bool

    - name: Evaluate backup completion across the ReplicaSet
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: mysql-backup-alerts.yml
