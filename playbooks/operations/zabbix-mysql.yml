---
- name: Configure MySQL monitoring on the existing enrolled members
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  connection: ansible.netcommon.httpapi
  vars:
    ansible_become: false
    ansible_network_os: community.zabbix.zabbix
    ansible_user: Admin
    ansible_httpapi_pass: "{{ zabbix_admin_password }}"
    ansible_httpapi_port: 80
    ansible_httpapi_use_ssl: false
    ansible_zabbix_url_path: ""
    zabbix_agent_psks: "{{ zabbix_agent_psks_json | from_json }}"
  tasks:
    - name: Require both declared database members to be enrolled agents
      ansible.builtin.assert:
        that:
          - groups.get('svc_zabbix_mysql', []) | length == 2
          - groups.get('svc_zabbix_mysql', []) | sort == groups.get('svc_mysql', []) | sort
          - groups['svc_zabbix_mysql'] | difference(groups['svc_zabbix_agent']) | length == 0
        fail_msg: Declare both ReplicaSet members as existing monitored agents first.

    - name: Read existing host metadata without exposing credentials
      community.zabbix.zabbix_host_info:
      register: zabbix_api_existing_hosts
      no_log: true

    # The reused agent task omits write-only PSK fields only when this tag matches.
    # Check both existing hosts before any mutation to prevent enrollment or rotation.
    - name: Require existing hosts and unchanged provider-managed agent keys
      ansible.builtin.assert:
        that:
          - zabbix_agent_psks[item] is match('^[0-9a-fA-F]{64,512}$')
          - zabbix_agent_psks[item] | length % 2 == 0
          - zabbix_agent_psks.values() | list | unique | length == zabbix_agent_psks | length
          - zabbix_api_existing_hosts.hosts | selectattr('host', 'equalto', item) | list | length == 1
          - >-
            (zabbix_api_existing_hosts.hosts | selectattr('host', 'equalto', item)
             | map(attribute='tags') | flatten | selectattr('tag', 'equalto', 'psk-sha256')
             | map(attribute='value') | list) == [zabbix_agent_psks[item] | hash('sha256')]
        fail_msg: MySQL synchronization requires both existing hosts with matching agent PSK tags.
      loop: "{{ groups['svc_zabbix_mysql'] | sort }}"
      no_log: true

    - name: Synchronize only the existing MySQL member hosts
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: agent.yml
      loop: "{{ groups['svc_zabbix_mysql'] | sort }}"
      loop_control:
        loop_var: zabbix_target
