---
- name: Validate emergency failover authorization
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Require an explicit emergency failover confirmation
      ansible.builtin.assert:
        that:
          - mysql_target_primary is defined
          - (mysql_target_primary | default('')) in groups['svc_mysql']
          - >-
            mysql_failover_confirmation | default('')
            == 'force:' ~ (mysql_target_primary | default(''))
        fail_msg: >-
          Forced failover can lose transactions. Pass mysql_target_primary and
          mysql_failover_confirmation=force:<target> only after declaring the former PRIMARY unavailable.

    - name: Authorize only the confirmed emergency failover target
      ansible.builtin.add_host:
        name: "{{ mysql_target_primary }}"
        groups: mysql_failover_authorized_target
      changed_when: false

- name: Force an emergency MySQL ReplicaSet failover
  hosts: >-
    {{
      groups['mysql_failover_authorized_target']
      | default([])
      | first
      | default('localhost', true)
    }}
  gather_facts: true
  any_errors_fatal: true
  vars:
    mysql_replicaset_action: failover

  tasks:
    - name: Hold the target shared lock through the complete emergency failover
      block:
        - name: Acquire the target topology operation lock  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_backup
            tasks_from: acquire_topology_lock.yml

        - name: Force the ReplicaSet primary change  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_replicaset

        - name: Synchronize role DNS after forced failover  # noqa role-name[path] run-once[task]
          ansible.builtin.include_role:
            name: components/mysql_role_dns
          vars:
            mysql_role_dns_primary: "{{ mysql_replicaset_runtime_primary }}"
            mysql_role_dns_secondary: >-
              {{ mysql_replicaset_runtime_secondary | default('', true) }}
          when: not ansible_check_mode
          run_once: true

        - name: Validate every Router after forced failover  # noqa role-name[path] run-once[task]
          ansible.builtin.include_role:
            name: components/mysql_router
            tasks_from: validate.yml
            apply:
              delegate_to: "{{ mysql_router_validation_host }}"
          vars:
            mysql_router_require_secondary: false
          loop: "{{ groups['mysql_router_clients'] }}"
          loop_control:
            loop_var: mysql_router_validation_host
          when: not ansible_check_mode
          run_once: true
      always:
        - name: Release the target lock and restore its backup timer  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_backup
            tasks_from: release_topology_lock.yml
