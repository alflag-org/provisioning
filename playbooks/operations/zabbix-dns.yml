---
- name: Configure DNS measurements through the private HTTP API
  hosts: svc_zabbix_server
  gather_facts: false
  become: false
  connection: ansible.netcommon.httpapi
  vars:
    ansible_become: false
    ansible_network_os: community.zabbix.zabbix
    ansible_user: Admin
    ansible_httpapi_pass: "{{ zabbix_admin_password }}"
    ansible_httpapi_port: 80
    ansible_httpapi_use_ssl: false
    ansible_zabbix_url_path: ""
  tasks:
    - name: Synchronize explicitly enabled DNS counters
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: dns-statistics.yml
      loop: "{{ (groups['svc_dns_recursive'] + groups['svc_dns_authoritative']) | sort }}"
      loop_control:
        loop_var: zabbix_target
      when: hostvars[zabbix_target].zabbix_dns_statistics | default('') in ['unbound', 'nsd']

    - name: Configure externally named DNS response measurements
      ansible.builtin.include_role:
        name: services/zabbix_api  # noqa role-name[path]
        tasks_from: dns-external.yml
