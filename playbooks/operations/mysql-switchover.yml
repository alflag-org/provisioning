---
- name: Perform a planned MySQL ReplicaSet switchover
  hosts: svc_mysql
  gather_facts: true
  any_errors_fatal: true
  vars:
    mysql_replicaset_action: switchover

  pre_tasks:
    - name: Validate the planned switchover target  # noqa run-once[task]
      ansible.builtin.assert:
        that:
          - mysql_target_primary is defined
          - mysql_target_primary in groups['svc_mysql']
        fail_msg: Pass mysql_target_primary as one of the two svc_mysql hosts.
      run_once: true

  tasks:
    - name: Hold both shared locks through the complete planned switchover
      block:
        - name: Acquire the topology operation lock  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_backup
            tasks_from: acquire_topology_lock.yml

        - name: Switch the ReplicaSet primary  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_replicaset

        - name: Synchronize role DNS after planned switchover  # noqa role-name[path] run-once[task]
          ansible.builtin.include_role:
            name: components/mysql_role_dns
          vars:
            mysql_role_dns_primary: "{{ mysql_replicaset_runtime_primary }}"
            mysql_role_dns_secondary: "{{ mysql_replicaset_runtime_secondary }}"
          when: not ansible_check_mode
          run_once: true

        - name: Validate every Router after planned switchover  # noqa role-name[path] run-once[task]
          ansible.builtin.include_role:
            name: components/mysql_router
            tasks_from: validate.yml
            apply:
              delegate_to: "{{ mysql_router_validation_host }}"
          vars:
            mysql_router_require_secondary: true
          loop: "{{ groups['mysql_router_clients'] }}"
          loop_control:
            loop_var: mysql_router_validation_host
          when: not ansible_check_mode
          run_once: true
      always:
        - name: Release the topology locks and restore backup timers  # noqa role-name[path]
          ansible.builtin.include_role:
            name: components/mysql_backup
            tasks_from: release_topology_lock.yml
