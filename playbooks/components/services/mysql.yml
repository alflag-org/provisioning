---
- name: Converge shared MySQL data service hosts
  hosts: svc_mysql
  gather_facts: true

  roles:
    - role: services/mysql  # noqa role-name[path]

- name: Converge client-local MySQL Routers
  hosts: mysql_router_clients
  gather_facts: true

  roles:
    - role: components/mysql_router  # noqa role-name[path]
