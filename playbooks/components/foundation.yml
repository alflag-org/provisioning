---
- name: Converge shared foundation
  hosts: default
  gather_facts: true

  pre_tasks:
    - name: Prepare Talos sources before Atlas command discovery
      ansible.builtin.include_role:
        name: components/talos  # noqa role-name[path]
        tasks_from: prepare.yml
      when: talos_enabled | default(false)

  roles:
    - role: foundation/platform_vm  # noqa role-name[path]
      when: "'platform_vm' in group_names"
    - role: foundation/platform_lxc  # noqa role-name[path]
      when: "'platform_lxc' in group_names"
    - role: atlas_host
      vars:
        atlas_manage_operator_account: >-
          {{ hostvars[inventory_hostname].atlas_manage_operator_account | default(true)
             and not (
               ('platform_vm' in group_names or 'platform_lxc' in group_names)
               and atlas_operator_user == foundation_operator_user
               and atlas_operator_group == foundation_operator_group
               and atlas_operator_home == foundation_operator_home
               and atlas_operator_shell == foundation_operator_shell
               and atlas_operator_groups | sort == foundation_operator_groups | sort
               and atlas_manage_operator_authorized_keys == foundation_operator_manage_authorized_keys
               and atlas_operator_authorized_key_files | sort == foundation_operator_authorized_key_files | sort
               and atlas_manage_operator_sudoers == foundation_operator_manage_sudoers
               and atlas_operator_sudoers_path == foundation_operator_sudoers_path
               and atlas_operator_sudoers_content == foundation_operator_sudoers_content
             ) }}
    - role: ssh_server
    - role: systemd_resolved
    - role: resource_cleanup  # noqa role-name[path]

  tasks:
    - name: Prepare Talos after Atlas runtime preparation
      when: talos_enabled | default(false)
      environment:
        PATH: "{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        PYENV_ROOT: "{{ atlas_pyenv_root }}"
        ATLAS_HOME: "{{ atlas_home }}"
        ATLAS_ETC_DIR: "{{ atlas_etc_dir }}"
        ATLAS_VAR_DIR: "{{ atlas_var_dir }}"
        TMPDIR: "{{ atlas_tmp_dir }}"
      block:
        - name: Install Talos in its dedicated virtual environment
          ansible.builtin.include_role:
            name: components/talos  # noqa role-name[path]
            tasks_from: runtime.yml
