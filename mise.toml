[tools]
python = "3.13.3"

[tasks.setup]
description = "Install validation tools and Ansible collections"
run = """
python -m venv .venv
.venv/bin/python -m pip install --requirement requirements-dev.txt
.venv/bin/ansible-galaxy collection install \
  --requirements-file collections/requirements.yml \
  --collections-path collections
"""

[tasks.lint]
description = "Lint provisioning YAML and Ansible content"
run = """
.venv/bin/yamllint \
  .github/workflows \
  .yamllint \
  inventories \
  playbooks \
  roles \
  collections/requirements.yml
PATH="$PWD/.venv/bin:$PATH" ansible-lint \
  playbooks/site.yml \
  playbooks/bootstrap.yml \
  playbooks/cloudflare.yml \
  playbooks/operations/mysql-switchover.yml \
  playbooks/operations/mysql-failover.yml \
  playbooks/operations/mysql-backup.yml \
  playbooks/operations/mysql-restore-test.yml
"""

[tasks.syntax]
description = "Check playbook syntax"
run = """
.venv/bin/ansible-playbook --syntax-check playbooks/site.yml
.venv/bin/ansible-playbook --syntax-check playbooks/bootstrap.yml
.venv/bin/ansible-playbook --syntax-check playbooks/cloudflare.yml
.venv/bin/ansible-playbook --syntax-check playbooks/operations/mysql-switchover.yml
.venv/bin/ansible-playbook --syntax-check playbooks/operations/mysql-failover.yml
.venv/bin/ansible-playbook --syntax-check playbooks/operations/mysql-backup.yml
.venv/bin/ansible-playbook --syntax-check playbooks/operations/mysql-restore-test.yml
"""

[tasks.test]
description = "Run repository unit tests"
run = ".venv/bin/python -m unittest discover -s tests -p 'test_*.py'"

[tasks.check]
description = "Run repository validation"
depends = ["lint", "syntax", "test"]
