[tools]
python = "3.13.3"

[tasks.setup]
description = "Install validation tools and Ansible collections"
run = """
python -m venv .venv
.venv/bin/python -m pip install --requirement requirements-dev.txt
.venv/bin/ansible-galaxy collection install \
  --requirements-file collections/requirements.yml \
  --collections-path collections
"""

[tasks.lint]
description = "Lint repository YAML and Ansible content"
run = """
.venv/bin/yamllint .
PATH="$PWD/.venv/bin:$PATH" ansible-lint playbooks roles
"""

[tasks.syntax]
description = "Check all playbooks recursively"
run = """
#!/usr/bin/env bash
set -euo pipefail
shopt -s globstar nullglob
playbooks=(playbooks/**/*.yml playbooks/**/*.yaml)
if [[ -z "${playbooks[*]}" ]]; then
  echo "No playbooks found" >&2
  exit 1
fi
for playbook in "${playbooks[@]}"; do
  .venv/bin/ansible-playbook --syntax-check "$playbook"
done
"""

[tasks.test]
description = "Run repository unit tests"
run = ".venv/bin/python -m unittest discover -s tests -p 'test_*.py'"

[tasks.check]
description = "Run repository validation"
depends = ["lint", "syntax", "test"]
