---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v4

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up validation environment
        run: mise run setup

      - name: Validate repository
        run: mise run check
