---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate provisioning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install validation dependencies
        run: mise run setup

      - name: Validate provisioning
        run: mise run check
