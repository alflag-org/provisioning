---
site_name: default
site_short_name: default

ansible_user: ops
ansible_become: true

node_exporter_enabled: true
node_exporter_listen_address: 0.0.0.0
node_exporter_listen_port: 9100

# Atlas is a required part of every managed host's foundation.
atlas_validate_runtime: true

# Apt package updates are handled by unattended-upgrades. Ansible only invokes
# apt when a requested package is missing or an explicit purge is needed.
apt_state_update_cache: true
apt_state_cache_valid_time: 86400
