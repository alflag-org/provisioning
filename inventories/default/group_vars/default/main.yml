---
site_name: default
site_short_name: default

ansible_user: ops
ansible_become: true

network_primary_fqdn: "{{ inventory_hostname }}.srv.alflag.internal"

# Atlas is a required part of every managed host's foundation.
atlas_validate_runtime: true

# Package upgrades are handled by unattended-upgrades.
apt_cache_valid_time: 86400

network_ipv4_address: "{{ ansible_host }}"
network_prefix_length: "{{ network_cidr.split('/')[1] | int }}"
network_address: "{{ network_ipv4_address }}/{{ network_prefix_length }}"
network_dns_resolvers: "{{ groups['svc_dns_recursive'] | sort | map('extract', hostvars, 'ansible_host') | list }}"
systemd_resolved_dns: "{{ network_dns_resolvers }}"
systemd_resolved_domains:
  - srv.alflag.internal
  - access.internal
