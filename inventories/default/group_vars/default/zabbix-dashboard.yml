---
zabbix_dashboard_linux_hosts_json: >-
  {% set fields = [] %}
  {% for target in groups['svc_zabbix_agent'] | sort %}
  {% set _ = fields.append({'type': 1, 'name': 'ds.0.hosts.' ~ loop.index0, 'value': target}) %}
  {% endfor %}
  {{ fields | to_json }}
zabbix_dashboard_base:
  name: Provisioning infrastructure
  private: 0
  display_period: 30
  auto_start: 0
  pages:
    - name: Overview
      display_period: 0
      widgets:
        - type: hostnavigator
          name: Managed hosts and host dashboards
          x: 0
          y: 0
          width: 24
          height: 10
          view_mode: 0
          fields:
            - {type: 1, name: reference, value: HOSTS}
            - {type: 2, name: groupids.0, value: "{{ zabbix_dashboard_group.json.result[0].groupid }}"}
            - {type: 0, name: show_problems, value: 0}
        - type: problems
          name: Recent infrastructure problems
          x: 24
          y: 0
          width: 48
          height: 10
          view_mode: 0
          fields:
            - {type: 2, name: groupids.0, value: "{{ zabbix_dashboard_group.json.result[0].groupid }}"}
            - {type: 0, name: show, value: 1}
            - {type: 0, name: show_lines, value: 25}
    - name: Linux performance
      display_period: 0
      widgets:
        - type: svggraph
          name: CPU utilization
          x: 0
          y: 0
          width: 36
          height: 5
          view_mode: 0
          fields: >-
            {{ (zabbix_dashboard_linux_hosts_json | from_json) + [
              {'type': 1, 'name': 'reference', 'value': 'CPUTL'},
              {'type': 1, 'name': 'ds.0.items.0', 'value': 'CPU utilization'},
              {'type': 1, 'name': 'ds.0.color', 'value': '199C0D'}] }}
        - type: svggraph
          name: Available memory in %
          x: 36
          y: 0
          width: 36
          height: 5
          view_mode: 0
          fields: >-
            {{ (zabbix_dashboard_linux_hosts_json | from_json) + [
              {'type': 1, 'name': 'reference', 'value': 'MEMUT'},
              {'type': 1, 'name': 'ds.0.items.0', 'value': 'Available memory in %'},
              {'type': 1, 'name': 'ds.0.color', 'value': '2774A4'}] }}
        - type: svggraph
          name: I/O pressure
          x: 0
          y: 5
          width: 36
          height: 5
          view_mode: 0
          fields: >-
            {{ (zabbix_dashboard_linux_hosts_json | from_json) + [
              {'type': 1, 'name': 'reference', 'value': 'IOPSI'},
              {'type': 1, 'name': 'ds.0.items.0', 'value': 'IO pressure, some avg10'},
              {'type': 1, 'name': 'ds.0.color', 'value': 'F63100'}] }}
        - type: svggraph
          name: Interface traffic
          x: 36
          y: 5
          width: 36
          height: 5
          view_mode: 0
          fields: >-
            {{ (zabbix_dashboard_linux_hosts_json | from_json) + [
              {'type': 1, 'name': 'reference', 'value': 'NETIO'},
              {'type': 1, 'name': 'ds.0.items.0', 'value': 'Interface *: Bits received'},
              {'type': 1, 'name': 'ds.0.items.1', 'value': 'Interface *: Bits sent'},
              {'type': 1, 'name': 'ds.0.color', 'value': 'F7941D'}] }}
    - name: DNS and monitoring
      display_period: 0
      widgets:
        - type: svggraph
          name: DNS response time
          x: 0
          y: 0
          width: 36
          height: 5
          view_mode: 0
          fields:
            - {type: 1, name: reference, value: DNSRT}
            - {type: 1, name: ds.0.hosts.0, value: "{{ inventory_hostname }}"}
            - {type: 1, name: ds.0.items.0, value: 'DNS * response time'}
            - {type: 1, name: ds.0.color, value: 199C0D}
        - type: svggraph
          name: DNS query success
          x: 36
          y: 0
          width: 36
          height: 5
          view_mode: 0
          fields:
            - {type: 1, name: reference, value: DNSOK}
            - {type: 1, name: ds.0.hosts.0, value: "{{ inventory_hostname }}"}
            - {type: 1, name: ds.0.items.0, value: 'DNS * query success'}
            - {type: 1, name: ds.0.color, value: 2774A4}
        - type: svggraph
          name: Monitoring database size
          x: 0
          y: 5
          width: 36
          height: 5
          view_mode: 0
          fields:
            - {type: 1, name: reference, value: DBSIZ}
            - {type: 1, name: ds.0.hosts.0, value: "{{ inventory_hostname }}"}
            - {type: 1, name: ds.0.items.0, value: Monitoring database size}
            - {type: 1, name: ds.0.color, value: F7941D}
        - type: svggraph
          name: Zabbix processed values
          x: 36
          y: 5
          width: 36
          height: 5
          view_mode: 0
          fields:
            - {type: 1, name: reference, value: NVPSV}
            - {type: 1, name: ds.0.hosts.0, value: "{{ inventory_hostname }}"}
            - {type: 1, name: ds.0.items.0, value: '*Number of processed values per second*'}
            - {type: 1, name: ds.0.color, value: F63100}
zabbix_dashboard: >-
  {{ zabbix_dashboard_base | combine({'pages': zabbix_dashboard_base.pages
     + ([zabbix_dashboard_network_page] if zabbix_dashboard_network_hosts_json | from_json | length > 0 else [])
     + ([zabbix_dashboard_dns_page] if zabbix_dashboard_dns_hosts_json | from_json | length > 0 else [])}) }}
zabbix_dashboard_network_hosts_json: >-
  {% set fields = [] %}
  {% for target in groups.get('zabbix_network_devices', []) | sort %}
  {% if 'ICMP Ping' in hostvars[target].zabbix_monitor_templates | default([]) %}
  {% set _ = fields.append({'type': 1, 'name': 'ds.0.hosts.' ~ (fields | length), 'value': target}) %}
  {% endif %}
  {% endfor %}
  {{ fields | to_json }}
zabbix_dashboard_dns_hosts_json: >-
  {% set fields = [] %}
  {% for target in (groups['svc_dns_recursive'] + groups['svc_dns_authoritative']) | sort %}
  {% if target in groups['svc_zabbix_agent'] and
        hostvars[target].zabbix_dns_statistics | default('') in ['unbound', 'nsd'] %}
  {% set _ = fields.append({'type': 1, 'name': 'ds.0.hosts.' ~ (fields | length), 'value': target}) %}
  {% endif %}
  {% endfor %}
  {{ fields | to_json }}
zabbix_dashboard_dns_cache_hosts_json: >-
  {% set fields = [] %}
  {% for target in groups['svc_dns_recursive'] | sort %}
  {% if target in groups['svc_zabbix_agent'] and
        hostvars[target].zabbix_dns_statistics | default('') == 'unbound' %}
  {% set _ = fields.append({'type': 1, 'name': 'ds.0.hosts.' ~ (fields | length), 'value': target}) %}
  {% endif %}
  {% endfor %}
  {{ fields | to_json }}
zabbix_dashboard_network_page:
  name: Network ICMP
  display_period: 0
  widgets:
    - type: svggraph
      name: Device reachability
      x: 0
      y: 0
      width: 36
      height: 5
      view_mode: 0
      fields: >-
        {{ (zabbix_dashboard_network_hosts_json | from_json) + [
          {'type': 1, 'name': 'reference', 'value': 'ICMPS'},
          {'type': 1, 'name': 'ds.0.items.0', 'value': 'ICMP ping'},
          {'type': 1, 'name': 'ds.0.color', 'value': '199C0D'}] }}
    - type: svggraph
      name: Device response time
      x: 36
      y: 0
      width: 36
      height: 5
      view_mode: 0
      fields: >-
        {{ (zabbix_dashboard_network_hosts_json | from_json) + [
          {'type': 1, 'name': 'reference', 'value': 'ICMPR'},
          {'type': 1, 'name': 'ds.0.items.0', 'value': 'ICMP response time'},
          {'type': 1, 'name': 'ds.0.color', 'value': '2774A4'}] }}
    - type: svggraph
      name: Device packet loss
      x: 0
      y: 5
      width: 36
      height: 5
      view_mode: 0
      fields: >-
        {{ (zabbix_dashboard_network_hosts_json | from_json) + [
          {'type': 1, 'name': 'reference', 'value': 'ICMPL'},
          {'type': 1, 'name': 'ds.0.items.0', 'value': 'ICMP loss'},
          {'type': 1, 'name': 'ds.0.color', 'value': 'F63100'}] }}
zabbix_dashboard_dns_page:
  name: DNS counters
  display_period: 0
  widgets: >-
    {{ zabbix_dashboard_dns_counter_widgets
       + ([zabbix_dashboard_dns_cache_widget] if zabbix_dashboard_dns_cache_hosts_json | from_json | length > 0 else []) }}
zabbix_dashboard_dns_counter_widgets:
  - type: svggraph
    name: DNS queries per second
    x: 0
    y: 0
    width: 36
    height: 5
    view_mode: 0
    fields: >-
      {{ (zabbix_dashboard_dns_hosts_json | from_json) + [
        {'type': 1, 'name': 'reference', 'value': 'DNSQR'},
        {'type': 1, 'name': 'ds.0.items.0', 'value': 'DNS queries per second'},
        {'type': 1, 'name': 'ds.0.color', 'value': '199C0D'}] }}
  - type: svggraph
    name: DNS response codes per second
    x: 36
    y: 0
    width: 36
    height: 5
    view_mode: 0
    fields: >-
      {{ (zabbix_dashboard_dns_hosts_json | from_json) + [
        {'type': 1, 'name': 'reference', 'value': 'DNSRC'},
        {'type': 1, 'name': 'ds.0.items.0', 'value': 'DNS SERVFAIL per second'},
        {'type': 1, 'name': 'ds.0.items.1', 'value': 'DNS NXDOMAIN per second'},
        {'type': 1, 'name': 'ds.0.color', 'value': 'F63100'}] }}
zabbix_dashboard_dns_cache_widget:
  type: svggraph
  name: Recursive DNS cache hits and misses per second
  x: 0
  y: 5
  width: 36
  height: 5
  view_mode: 0
  fields: >-
    {{ (zabbix_dashboard_dns_cache_hosts_json | from_json) + [
      {'type': 1, 'name': 'reference', 'value': 'DNSCH'},
      {'type': 1, 'name': 'ds.0.items.0', 'value': 'DNS cache_hits per second'},
      {'type': 1, 'name': 'ds.0.items.1', 'value': 'DNS cache_misses per second'},
      {'type': 1, 'name': 'ds.0.color', 'value': '2774A4'}] }}
