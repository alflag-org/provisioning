---
ansible_user: root
ansible_become: false

hostname: dns-authoritative01
zone: mgmt
role: dns_authoritative
virtualization_type: lxc
os_distribution: Ubuntu
os_version: "26.04"

network_address: 10.10.10.242/24
network_ipv4_address: 10.10.10.242
network_prefix_length: 24
network_gateway: 10.10.10.1
network_dns_resolvers:
  - 10.10.10.240
  - 10.10.10.241
network_primary_fqdn: dns-authoritative01.srv.alflag.internal

dns_authoritative_enabled: true
dns_authoritative_listen_addresses:
  - "127.0.0.1"
  - "10.10.10.242"
