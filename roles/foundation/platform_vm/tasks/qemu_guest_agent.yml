---
- name: Install QEMU guest agent
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
  become: true

- name: Gather service state
  ansible.builtin.service_facts:

- name: Start and enable QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    enabled: true
    state: started
  # Check mode cannot start a service whose package has not been installed yet.
  when: not ansible_check_mode or 'qemu-guest-agent.service' in ansible_facts.services
