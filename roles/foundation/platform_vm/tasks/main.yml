---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default(inventory_hostname) }}"
  become: true

- name: Configure VM timezone
  community.general.timezone:
    name: Asia/Tokyo
  become: true

- name: Enable ja_JP.UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*ja_JP\.UTF-8\s+UTF-8$'
    line: ja_JP.UTF-8 UTF-8
    create: false
    owner: root
    group: root
    mode: "0644"
  notify: Generate VM ja_JP.UTF-8 locale
  become: true

- name: Install VM base packages
  ansible.builtin.apt:
    name: "{{ foundation_vm_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
  become: true

- name: Configure QEMU guest agent
  ansible.builtin.include_tasks:
    file: qemu_guest_agent.yml
    apply:
      tags: qemu_guest_agent
  tags: qemu_guest_agent

- name: Ensure VM operator account  # noqa role-name[path]
  ansible.builtin.include_role:
    name: foundation/operator

- name: Configure VM swap policy
  ansible.builtin.include_tasks:
    file: swap.yml
  when:
    - not foundation_vm_skip_swap | bool
    - ansible_facts.get('virtualization_type', '') != 'lxc'

- name: Configure VM unattended upgrades
  ansible.builtin.include_tasks:
    file: unattended_upgrades.yml
  when:
    - not foundation_vm_skip_unattended_upgrades | bool
    - ansible_facts.get('virtualization_type', '') != 'lxc'
