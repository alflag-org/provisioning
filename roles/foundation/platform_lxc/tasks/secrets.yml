---
- name: Check local secrets source
  ansible.builtin.stat:
    path: "{{ foundation_lxc_secrets_source }}"
  delegate_to: localhost
  become: false
  register: foundation_lxc_secrets_source_stat

- name: Require local secrets source
  ansible.builtin.assert:
    that:
      - foundation_lxc_secrets_source_stat.stat.isdir | default(false)
    fail_msg: >-
      Local secrets source is missing or not a directory: {{ foundation_lxc_secrets_source }}.
      Create it or override foundation_lxc_secrets_source before converging LXC hosts.
  when: foundation_lxc_secrets_required | bool

- name: Ensure operator secrets directory exists
  ansible.builtin.file:
    path: "{{ foundation_operator_home }}/secrets"
    state: directory
    owner: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    mode: "0700"
  become: "{{ foundation_lxc_become_root }}"
  when: foundation_lxc_secrets_source_stat.stat.isdir | default(false)

- name: Copy operator secrets
  ansible.builtin.copy:
    src: "{{ foundation_lxc_secrets_source }}/"
    dest: "{{ foundation_operator_home }}/secrets/"
    owner: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    mode: preserve
    directory_mode: "0700"
  become: "{{ foundation_lxc_become_root }}"
  when: foundation_lxc_secrets_source_stat.stat.isdir | default(false)

- name: Ensure synced secrets are owned by the LXC operator
  ansible.builtin.file:
    path: "{{ foundation_operator_home }}/secrets"
    state: directory
    owner: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    recurse: true
  become: "{{ foundation_lxc_become_root }}"
  when: foundation_lxc_secrets_source_stat.stat.isdir | default(false)
