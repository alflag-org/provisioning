---
- name: Enable ja_JP.UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*ja_JP\.UTF-8\s+UTF-8$'
    line: ja_JP.UTF-8 UTF-8
    create: false
    owner: root
    group: root
    mode: "0644"
  register: foundation_lxc_locale_gen
  become: "{{ foundation_lxc_become_root }}"

- name: Generate ja_JP.UTF-8 locale
  ansible.builtin.command:
    cmd: locale-gen ja_JP.UTF-8
  changed_when: true
  when: foundation_lxc_locale_gen.changed
  become: "{{ foundation_lxc_become_root }}"
