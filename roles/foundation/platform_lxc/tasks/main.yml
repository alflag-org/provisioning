---
- name: Ensure LXC operator account  # noqa role-name[path]
  ansible.builtin.include_role:
    name: foundation/operator
    public: true

- name: Enable ja_JP.UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*ja_JP\.UTF-8\s+UTF-8$'
    line: ja_JP.UTF-8 UTF-8
    create: false
    owner: root
    group: root
    mode: "0644"
  notify: Generate LXC ja_JP.UTF-8 locale
  become: "{{ foundation_lxc_become_root }}"
  when: not foundation_lxc_skip_locale | bool

- name: Install LXC base packages
  ansible.builtin.apt:
    name: "{{ foundation_lxc_packages + ([] if foundation_lxc_skip_unattended_upgrades | bool else ['unattended-upgrades']) }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
  become: "{{ foundation_lxc_become_root }}"

- name: Configure LXC unattended upgrades
  ansible.builtin.copy:
    src: "{{ (role_path | dirname) ~ '/files/etc/apt/apt.conf.d/' ~ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [20auto-upgrades, 50unattended-upgrades]
  become: "{{ foundation_lxc_become_root }}"
  notify: Restart LXC unattended-upgrades
  when: not foundation_lxc_skip_unattended_upgrades | bool
