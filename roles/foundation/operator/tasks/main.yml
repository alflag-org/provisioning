---
- name: Check operator public keys exist on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  register: foundation_operator_key_stats
  loop: "{{ foundation_operator_authorized_key_files }}"
  when: foundation_operator_manage_authorized_keys | bool

- name: Require operator public keys on the controller
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      Missing operator public key on the controller: {{ item.stat.path }}.
      Create it or override foundation_operator_authorized_key_files before bootstrapping host access.
  loop: "{{ foundation_operator_key_stats.results | default([]) }}"
  when: foundation_operator_manage_authorized_keys | bool

- name: Ensure operator group exists
  ansible.builtin.group:
    name: "{{ foundation_operator_group }}"
    state: present
  become: "{{ foundation_operator_become_root }}"

- name: Ensure operator user exists
  ansible.builtin.user:
    name: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    groups: "{{ foundation_operator_groups | join(',') }}"
    append: true
    shell: "{{ foundation_operator_shell }}"
    create_home: true
    home: "{{ foundation_operator_home }}"
    state: present
  become: "{{ foundation_operator_become_root }}"

- name: Ensure operator .ssh directory exists
  ansible.builtin.file:
    path: "{{ foundation_operator_home }}/.ssh"
    state: directory
    owner: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    mode: "0700"
  become: "{{ foundation_operator_become_root }}"
  when: foundation_operator_manage_authorized_keys | bool

- name: Install operator authorized keys
  ansible.builtin.lineinfile:
    path: "{{ foundation_operator_home }}/.ssh/authorized_keys"
    line: "{{ lookup('ansible.builtin.file', item) | trim }}"
    create: true
    owner: "{{ foundation_operator_user }}"
    group: "{{ foundation_operator_group }}"
    mode: "0600"
    state: present
  become: "{{ foundation_operator_become_root }}"
  loop: "{{ foundation_operator_authorized_key_files }}"
  when: foundation_operator_manage_authorized_keys | bool

- name: Install passwordless sudo for the operator
  ansible.builtin.copy:
    content: "{{ foundation_operator_sudoers_content }}\n"
    dest: "{{ foundation_operator_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  become: "{{ foundation_operator_become_root }}"
  when: foundation_operator_manage_sudoers | bool
