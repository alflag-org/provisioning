---
- name: Reload Atlas Cluster ingress
  ansible.builtin.systemd_service:
    name: atlas-cluster-ingress
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart Atlas Cluster
  ansible.builtin.systemd_service:
    name: atlas-daemon-cluster
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
