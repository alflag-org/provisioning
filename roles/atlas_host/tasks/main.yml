---
- name: Remove the legacy Atlas installation
  ansible.builtin.import_tasks: cleanup.yml
  when: atlas_remove_legacy_installation | bool

- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Ensure Atlas operator account
  ansible.builtin.include_role:
    name: foundation/operator  # noqa role-name[path]
  when: atlas_manage_operator_account | bool
  vars:
    foundation_operator_user: "{{ atlas_operator_user }}"
    foundation_operator_group: "{{ atlas_operator_group }}"
    foundation_operator_home: "{{ atlas_operator_home }}"
    foundation_operator_shell: "{{ atlas_operator_shell }}"
    foundation_operator_groups: "{{ atlas_operator_groups }}"
    foundation_operator_authorized_key_files: "{{ atlas_operator_authorized_key_files }}"
    foundation_operator_sudoers_path: "{{ atlas_operator_sudoers_path }}"
    foundation_operator_sudoers_content: "{{ atlas_operator_sudoers_content }}"
    foundation_operator_manage_authorized_keys: "{{ atlas_manage_operator_authorized_keys }}"
    foundation_operator_manage_sudoers: "{{ atlas_manage_operator_sudoers }}"
    foundation_operator_become_root: "{{ atlas_become_root }}"

- name: Create directories
  ansible.builtin.import_tasks: directories.yml

- name: Install pyenv
  ansible.builtin.import_tasks: pyenv.yml

- name: Remove the separate pyenv profile block
  ansible.builtin.blockinfile:
    path: "{{ atlas_operator_profile }}"
    marker: "# {mark} ANSIBLE MANAGED PYENV"
    state: absent
    create: true
    mode: "0644"
  become: "{{ atlas_become_operator }}"

- name: Configure Atlas environment profile
  ansible.builtin.blockinfile:
    path: "{{ atlas_operator_profile }}"
    marker: "# {mark} ANSIBLE MANAGED ATLAS ENV"
    create: true
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    mode: "0644"
    block: |
      export PYENV_ROOT={{ atlas_pyenv_root | quote }}
      export PATH="{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/shims:$PATH"
      export ATLAS_HOME={{ atlas_home | quote }}
      export ATLAS_ETC_DIR={{ atlas_etc_dir | quote }}
      export ATLAS_VAR_DIR={{ atlas_var_dir | quote }}
      export TMPDIR={{ atlas_tmp_dir | quote }}
      export PYTHON_BUILD_CACHE_PATH={{ atlas_python_build_cache_path | quote }}
      eval "$(pyenv init - bash)"
  become: "{{ atlas_become_operator }}"

- name: Render Atlas configuration
  ansible.builtin.import_tasks: config.yml

- name: Manage Atlas CLI and generated resources
  environment:
    PATH: "{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    PYENV_ROOT: "{{ atlas_pyenv_root }}"
    ATLAS_HOME: "{{ atlas_home }}"
    ATLAS_ETC_DIR: "{{ atlas_etc_dir }}"
    ATLAS_VAR_DIR: "{{ atlas_var_dir }}"
    TMPDIR: "{{ atlas_tmp_dir }}"
    PYTHON_BUILD_CACHE_PATH: "{{ atlas_python_build_cache_path }}"
  block:
    - name: Install Atlas CLI
      ansible.builtin.import_tasks: cli.yml

    - name: Manage Atlas runtime
      ansible.builtin.import_tasks: runtime.yml
      when: atlas_manage_runtime | bool

    - name: Manage Atlas command shims
      ansible.builtin.import_tasks: shims.yml
