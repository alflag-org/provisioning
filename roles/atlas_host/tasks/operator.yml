---
- name: Ensure Atlas operator group exists
  ansible.builtin.group:
    name: "{{ atlas_operator_group }}"
    state: present
  become: "{{ atlas_become_root }}"

- name: Ensure Atlas operator user exists
  ansible.builtin.user:
    name: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    groups: "{{ atlas_operator_groups | join(',') }}"
    append: true
    shell: "{{ atlas_operator_shell }}"
    create_home: true
    home: "{{ atlas_operator_home }}"
    state: present
  become: "{{ atlas_become_root }}"

- name: Ensure Atlas operator .ssh directory exists
  ansible.builtin.file:
    path: "{{ atlas_operator_home }}/.ssh"
    state: directory
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    mode: "0700"
  become: "{{ atlas_become_root }}"
  when: atlas_manage_operator_authorized_keys | bool

- name: Install Atlas operator authorized keys
  ansible.builtin.lineinfile:
    path: "{{ atlas_operator_home }}/.ssh/authorized_keys"
    line: "{{ lookup('ansible.builtin.file', item) | trim }}"
    create: true
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    mode: "0600"
    state: present
  become: "{{ atlas_become_root }}"
  loop: "{{ atlas_operator_authorized_key_files }}"
  when: atlas_manage_operator_authorized_keys | bool

- name: Install passwordless sudo for the Atlas operator
  ansible.builtin.copy:
    content: "{{ atlas_operator_sudoers_content }}\n"
    dest: "{{ atlas_operator_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  become: "{{ atlas_become_root }}"
  when: atlas_manage_operator_sudoers | bool
