---
- name: Check Atlas status
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} status"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false

- name: Check Atlas configuration and registered programs
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} check"
  environment:
    PATH: "{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    PYENV_ROOT: "{{ atlas_pyenv_root }}"
    TMPDIR: "{{ atlas_tmp_dir }}"
    PYTHON_BUILD_CACHE_PATH: "{{ atlas_python_build_cache_path }}"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
  when: atlas_validate_runtime | bool

- name: Check Atlas runtime status
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} runtime status"
  environment:
    PATH: "{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    PYENV_ROOT: "{{ atlas_pyenv_root }}"
    TMPDIR: "{{ atlas_tmp_dir }}"
    PYTHON_BUILD_CACHE_PATH: "{{ atlas_python_build_cache_path }}"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
  when: atlas_validate_runtime | bool

- name: Check Atlas program discovery
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} program list --verbose"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false

- name: Check Atlas command discovery
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} command list --verbose"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
