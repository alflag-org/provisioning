---
- name: Check Atlas status
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} status"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false

- name: Check Atlas configuration and registered programs
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} check"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
  when: atlas_validate_runtime | bool

- name: Check Atlas runtime status
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} runtime status"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
  when: atlas_validate_runtime | bool

- name: Check Atlas program discovery
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} program list --verbose"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false

- name: Check Atlas command discovery
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} command list --verbose"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  check_mode: false
  changed_when: false
