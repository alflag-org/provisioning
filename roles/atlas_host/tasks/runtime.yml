---
- name: Select declared Atlas Python versions
  ansible.builtin.set_fact:
    atlas_runtime_versions: >-
      {{ ([atlas_runtime_python_version | default('configured', true)]
          + (atlas.programs.values()
             | selectattr('runtime.type', 'equalto', 'python')
             | map(attribute='runtime.python', default=atlas_runtime_python_version)
             | list))
         | reject('equalto', '') | unique | list }}

- name: Require runtime versions to be path components
  ansible.builtin.assert:
    that:
      - atlas_runtime_version is string
      - atlas_runtime_version | basename == atlas_runtime_version
      - atlas_runtime_version not in ['.', '..']
    fail_msg: Atlas runtime versions must not escape the managed runtime directory.
  loop: "{{ atlas_runtime_versions }}"
  loop_control:
    loop_var: atlas_runtime_version

- name: Manage selected Atlas Python runtimes
  ansible.builtin.include_tasks: runtime_version.yml
  loop: "{{ atlas_runtime_versions }}"
  loop_control:
    loop_var: atlas_runtime_version
  vars:
    atlas_runtime_source: >-
      {{ atlas_runtime_python_executable
         if atlas_runtime_python_executable | length > 0
            and atlas_runtime_version == (atlas_runtime_python_version | default('configured', true))
         else atlas_pyenv_root ~ '/versions/' ~ atlas_runtime_version ~ '/bin/python' }}
