---
- name: Ensure Atlas CLI venv ownership
  ansible.builtin.file:
    path: "{{ atlas_cli_venv }}"
    state: directory
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    recurse: true
    follow: false
  become: "{{ atlas_become_root }}"

- name: Create Atlas CLI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    mode: "0755"
  loop:
    - "{{ atlas_cli_venv | dirname }}"
    - "{{ atlas_cli_bin_dir }}"
  become: "{{ atlas_become_operator }}"

- name: Create Atlas CLI venv
  ansible.builtin.command:
    cmd: "{{ atlas_cli_python }} -m venv {{ atlas_cli_venv }}"
    creates: "{{ atlas_cli_venv }}/bin/python"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"

# Atlas follows the configured source; retain its existing upgrade policy.
- name: Upgrade pip in Atlas CLI venv  # noqa package-latest
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ atlas_cli_venv }}"
    virtualenv_command: "{{ atlas_cli_python }} -m venv"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"

- name: Install Atlas CLI  # noqa package-latest
  ansible.builtin.pip:
    name: "{{ atlas_cli_source }}"
    state: latest
    virtualenv: "{{ atlas_cli_venv }}"
    virtualenv_command: "{{ atlas_cli_python }} -m venv"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"

- name: Link atlas command
  ansible.builtin.file:
    src: "{{ atlas_cli_venv }}/bin/atlas"
    dest: "{{ atlas_cli_bin }}"
    state: link
    force: true
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
  become: "{{ atlas_become_operator }}"
