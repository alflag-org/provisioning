---
- name: Ensure pyenv tree ownership
  ansible.builtin.file:
    path: "{{ atlas_pyenv_root }}"
    state: directory
    owner: "{{ atlas_operator_user }}"
    group: "{{ atlas_operator_group }}"
    mode: "0775"
    follow: false
  become: "{{ atlas_become_root }}"

- name: Install pyenv
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ atlas_pyenv_root }}"
    version: master
    update: true
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
