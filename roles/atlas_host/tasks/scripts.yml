---
- name: Update Atlas scripts releases
  ansible.builtin.command:
    cmd: "{{ atlas_cli_bin }} scripts update"
  environment:
    PATH: "{{ atlas_pyenv_root }}/bin:{{ atlas_cli_bin_dir }}:{{ atlas_home }}/bin:{{ atlas_home }}/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    PYENV_ROOT: "{{ atlas_pyenv_root }}"
    TMPDIR: "{{ atlas_tmp_dir }}"
    PYTHON_BUILD_CACHE_PATH: "{{ atlas_python_build_cache_path }}"
  become: "{{ atlas_become_operator }}"
  become_user: "{{ atlas_operator_user }}"
  changed_when: true
  when: atlas_manage_scripts | default(false) | bool
