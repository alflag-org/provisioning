---
- name: Render Atlas config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ atlas_etc_dir }}/config.yml"
    owner: ops
    group: ops
    mode: "0644"
  become: true

- name: Render Atlas host.yml
  ansible.builtin.template:
    src: host.yml.j2
    dest: "{{ atlas_etc_dir }}/host.yml"
    owner: ops
    group: ops
    mode: "0644"
  become: true
