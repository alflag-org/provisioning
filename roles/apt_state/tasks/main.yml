---
- name: Validate apt state request
  ansible.builtin.assert:
    that:
      - apt_state_packages is defined
      - apt_state_state | default('present') in ['present', 'absent']
    quiet: true

- name: Check requested apt packages
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f=${binary:Package}\\t${db:Status-Status}\\n'] + apt_state_package_list }}"
  vars:
    apt_state_package_list: >-
      {{ [apt_state_packages] if apt_state_packages is string else apt_state_packages }}
  register: apt_state_query
  changed_when: false
  failed_when: false
  check_mode: false
  when: apt_state_package_list | length > 0

- name: Install missing apt packages
  ansible.builtin.apt:
    name: "{{ apt_state_package_list }}"
    state: present
    update_cache: "{{ apt_state_update_cache | default(true) | bool }}"
    cache_valid_time: >-
      {{ 0 if apt_state_force_update_cache | default(false) | bool else apt_state_cache_valid_time | default(86400) }}
    policy_rc_d: "{{ apt_state_policy_rc_d | default(omit) }}"
  vars:
    apt_state_package_list: >-
      {{ [apt_state_packages] if apt_state_packages is string else apt_state_packages }}
    apt_state_installed_package_count: >-
      {{
        apt_state_query.stdout_lines | default([])
        | select('match', '^[^\t]+\tinstalled$')
        | list
        | length
      }}
  become: "{{ apt_state_become | default(true) }}"
  when:
    - apt_state_package_list | length > 0
    - apt_state_state | default('present') == 'present'
    - apt_state_installed_package_count | int != apt_state_package_list | length

- name: Remove installed apt packages
  ansible.builtin.apt:
    name: "{{ apt_state_package_list }}"
    state: absent
    purge: "{{ apt_state_purge | default(false) | bool }}"
    autoremove: "{{ apt_state_autoremove | default(false) | bool }}"
  vars:
    apt_state_package_list: >-
      {{ [apt_state_packages] if apt_state_packages is string else apt_state_packages }}
  become: "{{ apt_state_become | default(true) }}"
  when:
    - apt_state_package_list | length > 0
    - apt_state_state | default('present') == 'absent'
    - apt_state_query.stdout_lines | default([]) | length > 0
