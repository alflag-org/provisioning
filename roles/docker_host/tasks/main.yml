---
- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_host_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_host_enabled | bool

- name: Install Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_host_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  when: docker_host_enabled | bool

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ docker_host_apt_repository }}"
    state: present
    filename: docker
  when: docker_host_enabled | bool

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_host_packages }}"
    state: present
    update_cache: true
  when: docker_host_enabled | bool

- name: Check Docker group
  ansible.builtin.getent:
    database: group
    key: "{{ docker_host_group }}"
    fail_key: false
  when:
    - docker_host_enabled | bool
    - docker_host_grant_zabbix_docker_access | bool

- name: Check Zabbix user for Docker access
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_host_zabbix_user }}"
    fail_key: false
  when:
    - docker_host_enabled | bool
    - docker_host_grant_zabbix_docker_access | bool

- name: Add Zabbix user to Docker group
  ansible.builtin.user:
    name: "{{ docker_host_zabbix_user }}"
    groups: "{{ docker_host_group }}"
    append: true
  become: true
  register: docker_host_zabbix_group_access
  when:
    - docker_host_enabled | bool
    - docker_host_grant_zabbix_docker_access | bool
    - ansible_facts.get('getent_group', {}).get(docker_host_group) is not none
    - ansible_facts.get('getent_passwd', {}).get(docker_host_zabbix_user) is not none

- name: Gather service facts for Zabbix restart
  ansible.builtin.service_facts:
  when:
    - docker_host_zabbix_group_access is changed
    - not ansible_check_mode

- name: Restart Zabbix agent after Docker group change
  ansible.builtin.service:
    name: "{{ docker_host_zabbix_service_name }}"
    state: restarted
  when:
    - docker_host_zabbix_group_access is changed
    - not ansible_check_mode
    - ansible_facts.services.get(docker_host_zabbix_service_name ~ '.service', {}) | length > 0

- name: Enable and start Docker service
  ansible.builtin.systemd_service:
    name: "{{ docker_host_service_name }}"
    state: started
    enabled: true
  when:
    - docker_host_enabled | bool
    - not ansible_check_mode

- name: Validate Docker daemon
  ansible.builtin.command:
    cmd: docker info
  changed_when: false
  when:
    - docker_host_enabled | bool
    - not ansible_check_mode
