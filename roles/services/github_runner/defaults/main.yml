services_github_runner_release_url: >-
  https://github.com/actions/runner/releases/download/v{{ services_github_runner_version }}/actions-runner-linux-x64-{{ services_github_runner_version }}.tar.gz
services_github_runner_packages:
  - acl
  - build-essential
  - ca-certificates
  - curl
  - git
  - gzip
  - libffi-dev
  - libicu-dev
  - libkrb5-3
  - libssl-dev
  - python3
  - tar
  - unzip
  - zlib1g
