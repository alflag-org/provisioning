---
- name: Create this instance group
  ansible.builtin.group:
    name: "{{ services_github_runner_user }}"
    system: true

- name: Create this instance nonprivileged account
  ansible.builtin.user:
    name: "{{ services_github_runner_user }}"
    group: "{{ services_github_runner_user }}"
    groups: []
    append: false
    system: true
    shell: /usr/sbin/nologin
    home: "{{ services_github_runner_home }}"
    create_home: false
  register: services_github_runner_account

- name: Refuse a root Runner account
  ansible.builtin.assert:
    that: services_github_runner_account.uid | int > 0
  when: not ansible_check_mode

- name: Protect this instance state parent against job-created symlinks
  ansible.builtin.file:
    path: "{{ services_github_runner_state }}"
    state: directory
    owner: root
    group: "{{ services_github_runner_user }}"
    mode: "0750"

- name: Create private instance directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ services_github_runner_user }}"
    group: "{{ services_github_runner_user }}"
    mode: "0700"
  loop: ["{{ services_github_runner_root }}", "{{ services_github_runner_home }}", "{{ services_github_runner_work }}"]

- name: Install the initial release without overwriting self-updated Runners
  ansible.builtin.import_tasks: release.yml

- name: Install per-instance cleanup hooks
  ansible.builtin.template:
    src: cleanup.sh.j2
    dest: "/usr/local/libexec/github-runner/{{ services_github_runner_instance.id }}-{{ item }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: [start, end]

- name: Bound this instance diagnostic retention
  ansible.builtin.copy:
    content: "e {{ services_github_runner_root }}/_diag - - - 7d\n"
    dest: "/etc/tmpfiles.d/github-runner-{{ services_github_runner_instance.id }}.conf"
    owner: root
    group: root
    mode: "0644"

- name: Install this instance unit
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: "/etc/systemd/system/{{ services_github_runner_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: services_github_runner_unit_file
