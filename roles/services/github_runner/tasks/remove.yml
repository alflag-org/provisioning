---
- name: Inspect this instance unit before removal
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ services_github_runner_unit }}"
  register: services_github_runner_installed_unit

- name: Stop only the selected Runner instance
  ansible.builtin.systemd_service:
    name: "{{ services_github_runner_unit }}"
    enabled: false
    state: stopped
  when: services_github_runner_installed_unit.stat.exists

- name: Deregister before deleting instance files
  ansible.builtin.command:
    argv: ["{{ services_github_runner_root }}/config.sh", remove]
    chdir: "{{ services_github_runner_root }}"
  environment:
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ services_github_runner_token }}"
    HOME: "{{ services_github_runner_home }}"
  become: true
  become_user: "{{ services_github_runner_user }}"
  changed_when: true
  no_log: true
  when: not ansible_check_mode and services_github_runner_registered

- name: Remove only this instance files after successful deregistration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ services_github_runner_unit }}"
    - "/etc/tmpfiles.d/github-runner-{{ services_github_runner_instance.id }}.conf"
    - "/usr/local/libexec/github-runner/{{ services_github_runner_instance.id }}-start.sh"
    - "/usr/local/libexec/github-runner/{{ services_github_runner_instance.id }}-end.sh"
    - "{{ services_github_runner_root }}"
    - "{{ services_github_runner_state }}"
  register: services_github_runner_removal

- name: Reload systemd after deleting an instance unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode and services_github_runner_removal.results[0].changed  # noqa no-handler

- name: Remove this instance user without removing shared resources
  ansible.builtin.user:
    name: "{{ services_github_runner_user }}"
    state: absent
    remove: false

- name: Remove this instance group
  ansible.builtin.group:
    name: "{{ services_github_runner_user }}"
    state: absent
