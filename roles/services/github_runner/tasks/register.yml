---
- name: Register a previously unregistered instance
  when: services_github_runner_operation == 'register' and not ansible_check_mode and not services_github_runner_registered
  block:
    # A failed client may have created a remote Runner without local credentials.
    - name: Record registration attempt without a token
      ansible.builtin.copy:
        content: "Inspect remote and local state before another registration attempt.\n"
        dest: "{{ services_github_runner_root }}/.registration-attempt"
        owner: "{{ services_github_runner_user }}"
        group: "{{ services_github_runner_user }}"
        mode: "0600"

    - name: Consume the transient token through official Runner input
      ansible.builtin.command:
        argv: >-
          {{ [services_github_runner_root ~ '/config.sh', '--unattended',
              '--url', services_github_runner_instance.url, '--name', services_github_runner_name,
              '--labels', 'ci-linux', '--work', services_github_runner_work] +
             (['--runnergroup', services_github_runner_instance.runner_group]
              if services_github_runner_instance.runner_group is defined else []) }}
        chdir: "{{ services_github_runner_root }}"
      environment:
        ACTIONS_RUNNER_INPUT_TOKEN: "{{ services_github_runner_token }}"
        HOME: "{{ services_github_runner_home }}"
      become: true
      become_user: "{{ services_github_runner_user }}"
      changed_when: true
      no_log: true

    - name: Verify complete registration before enabling the service
      ansible.builtin.import_tasks: state.yml

- name: Remove attempt marker only for a complete matching registration
  ansible.builtin.file:
    path: "{{ services_github_runner_root }}/.registration-attempt"
    state: absent
  when: services_github_runner_registered

- name: Restrict this instance registration file permissions
  ansible.builtin.file:
    path: "{{ services_github_runner_root }}/{{ item }}"
    owner: "{{ services_github_runner_user }}"
    group: "{{ services_github_runner_user }}"
    mode: "0600"
  loop: [.runner, .credentials, .credentials_rsaparams]
  no_log: true
  when: services_github_runner_registered

- name: Explain registration check-mode boundary
  ansible.builtin.debug:
    msg: Registration would consume a short-lived token. No registration or connectivity check runs in check mode.
  changed_when: true
  when: services_github_runner_operation == 'register' and ansible_check_mode and not services_github_runner_registered
