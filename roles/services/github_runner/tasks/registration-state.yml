---
- name: Inspect Runner registration and credential files without reading credentials
  ansible.builtin.stat:
    path: "/opt/github-actions-runner/{{ item }}"
    follow: false
  loop: [.runner, .credentials, .credentials_rsaparams, .service]
  register: services_github_runner_registration_files

- name: Refuse partial registration or an unmanaged service
  ansible.builtin.assert:
    that:
      - not services_github_runner_registration_files.results[3].stat.exists
      - >-
        (services_github_runner_registration_files.results[0].stat.exists and
         services_github_runner_registration_files.results[1].stat.exists and
         services_github_runner_registration_files.results[2].stat.exists) or
        (not services_github_runner_registration_files.results[0].stat.exists and
         not services_github_runner_registration_files.results[1].stat.exists and
         not services_github_runner_registration_files.results[2].stat.exists)
    fail_msg: Partial registration or a svc.sh-managed service exists. Inspect GitHub and local state before recovery.

- name: Refuse symlinked or non-regular registration files
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
    fail_msg: Runner registration files must be regular files.
  loop: "{{ services_github_runner_registration_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Initialize registration state
  ansible.builtin.set_fact:
    services_github_runner_settings: {}

- name: Read existing non-secret registration metadata
  ansible.builtin.slurp:
    src: /opt/github-actions-runner/.runner
  register: services_github_runner_metadata
  no_log: true
  when: services_github_runner_registration_files.results[0].stat.exists

- name: Decode existing registration
  ansible.builtin.set_fact:
    services_github_runner_settings: "{{ services_github_runner_metadata.content | b64decode | from_json }}"
  no_log: true
  when: services_github_runner_registration_files.results[0].stat.exists

- name: Validate existing registration identity without replacing it
  ansible.builtin.assert:
    that:
      - services_github_runner_settings.gitHubUrl | default('') == 'https://github.com/' ~ services_github_runner_repository
      - services_github_runner_settings.agentName | default('') == services_github_runner_name
      - services_github_runner_settings.agentId | default(0) | int > 0
      - services_github_runner_settings.workFolder | default('') == '/var/lib/github-actions-runner/work'
      - not services_github_runner_settings.disableUpdate | default(false)
      - not services_github_runner_settings.ephemeral | default(false)
    fail_msg: Existing registration differs from inventory. Deregister explicitly before changing identity or mode.
  when: services_github_runner_settings | length > 0

- name: Inspect repository Runners through the controller
  ansible.builtin.command:
    argv:
      - gh
      - api
      - --paginate
      - "repos/{{ services_github_runner_repository }}/actions/runners?per_page=100"
      - --jq
      - '.runners[] | {id, name, status, busy, labels: [.labels[].name | ascii_downcase]}'
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: services_github_runner_remote_list

- name: Decode repository Runner records
  ansible.builtin.set_fact:
    services_github_runner_remote: "{{ services_github_runner_remote_list.stdout_lines | map('from_json') | list }}"

- name: Refuse stale local registration or a conflicting remote name
  ansible.builtin.assert:
    that:
      - >-
        (services_github_runner_settings | length == 0 and
         services_github_runner_remote | selectattr('name', 'equalto', services_github_runner_name) | list | length == 0) or
        (services_github_runner_settings | length > 0 and
         services_github_runner_remote | selectattr('id', 'equalto', services_github_runner_settings.agentId | default(0)) |
         selectattr('name', 'equalto', services_github_runner_name) | list | length == 1)
    fail_msg: GitHub and local registration disagree. Do not overwrite or register another Runner; inspect both sides.

- name: Require an idle Runner before removal
  ansible.builtin.assert:
    that: >-
      services_github_runner_remote | selectattr('id', 'equalto', services_github_runner_settings.agentId) |
      selectattr('busy', 'equalto', true) | list | length == 0
    fail_msg: Runner is executing a job. Disable workflow dispatch to this Runner and wait before removal.
  when:
    - services_github_runner_operation == 'remove'
    - services_github_runner_settings | length > 0

- name: Require a transient token before registration or removal mutation
  ansible.builtin.assert:
    that:
      - services_github_runner_token | default('') | length > 0
      - services_github_runner_token is match('^[A-Za-z0-9_-]+$')
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      (services_github_runner_operation == 'register' and services_github_runner_settings | length == 0) or
      (services_github_runner_operation == 'remove' and services_github_runner_settings | length > 0)
