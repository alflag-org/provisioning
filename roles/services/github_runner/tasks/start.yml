---
# Unit changes take effect after a drained, explicit restart; convergence must not interrupt jobs.
- name: Enable only a registered instance
  ansible.builtin.systemd_service:
    name: "{{ services_github_runner_unit }}"
    daemon_reload: true
    enabled: true
    state: started
  when:
    - not ansible_check_mode
    - services_github_runner_operation != 'remove'
    - services_github_runner_registered
