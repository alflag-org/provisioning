---
- name: Restart monitoring PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted
  when: not ansible_check_mode

- name: Restart monitoring PHP
  ansible.builtin.systemd_service:
    name: "php{{ zabbix_php_version }}-fpm"
    state: restarted
  when: not ansible_check_mode

- name: Apply Zabbix ingress
  ansible.builtin.systemd_service:
    name: zabbix-ingress
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
