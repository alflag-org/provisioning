# Archive the matching RC packages because prerelease repositories may rotate.
zabbix_server_recovery_packages:
  - file: "zabbix-server-pgsql_{{ zabbix_package_version.split(':')[1] }}_amd64.deb"
    sha256: "{{ zabbix_server_platform.checksums['zabbix-server-pgsql'] }}"
  - file: "zabbix-frontend-php_{{ zabbix_package_version.split(':')[1] }}_all.deb"
    sha256: "{{ zabbix_server_platform.checksums['zabbix-frontend-php'] }}"
  - file: "zabbix-sql-scripts_{{ zabbix_package_version.split(':')[1] }}_all.deb"
    sha256: "{{ zabbix_server_platform.checksums['zabbix-sql-scripts'] }}"
  - file: "zabbix-agent2_{{ zabbix_package_version.split(':')[1] }}_amd64.deb"
    sha256: "{{ zabbix_server_platform.checksums['zabbix-agent2'] }}"
