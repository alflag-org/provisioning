---
zabbix_server_packages:
  - zabbix-server-pgsql
  - zabbix-frontend-php
  - zabbix-sql-scripts
  - zabbix-agent2
zabbix_database: zabbix
zabbix_server_platform: "{{ zabbix_server_platforms[ansible_facts.distribution_version] }}"
zabbix_postgresql_version: "{{ zabbix_server_platform.postgresql }}"
zabbix_php_version: "{{ zabbix_server_platform.php }}"
zabbix_server_platforms:
  "24.04":
    postgresql: "16"
    php: "8.3"
    checksums:
      zabbix-server-pgsql: 001033016fc413581f05db62d909a1c5ec42244c36948116676e431600fec50d
      zabbix-frontend-php: 148124137b41a65c8871ceb779d5104c452d25438d46019b38c0e4c1061f608a
      zabbix-sql-scripts: 19f065a24719a427a5ccf08c0a8934e11705ae64f2768132c85b5b0f3fdc68ee
      zabbix-agent2: 8e8c5c20263b14634b5ff8f9c1d773edac868d65313e8c6136fdc9d1d032b0e1
  "26.04":
    postgresql: "18"
    php: "8.5"
    checksums:
      zabbix-server-pgsql: c3b4ddfb825b489d4bc9aac97ecf23705fcf4748f0158d2996d4d09450a123a8
      zabbix-frontend-php: 311aa75425ec28e79fdf36e51d734a5ec17b6341767e09c0f1c7faaee0e5f269
