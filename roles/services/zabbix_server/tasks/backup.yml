---
- name: Create package recovery cache
  ansible.builtin.file:
    path: /var/cache/zabbix-recovery
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Preserve matching official RC2 packages for recovery
  ansible.builtin.get_url:
    url: "{{ zabbix_repository_url }}/pool/main/z/zabbix/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "/var/cache/zabbix-recovery/{{ item.file }}"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ zabbix_server_recovery_packages }}"
  when: not ansible_check_mode

- name: Install monitoring recovery program
  ansible.builtin.copy:
    src: zabbix-recovery.py
    dest: /usr/local/sbin/zabbix-recovery
    owner: root
    group: root
    mode: "0750"

- name: Create agent-readable non-secret recovery status directory
  ansible.builtin.file:
    path: /var/lib/zabbix-recovery
    state: directory
    owner: root
    group: zabbix
    mode: "0750"

- name: Configure monitoring backup storage identity
  ansible.builtin.copy:
    dest: /etc/zabbix/recovery.json
    content: >-
      {{ {'mount': zabbix_backup_mount, 'source': zabbix_backup_source,
          'database': zabbix_database, 'postgresql_version': zabbix_postgresql_version,
          'php_version': zabbix_php_version} | to_nice_json }}
    owner: root
    group: root
    mode: "0600"

- name: Install bounded recovery services
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - zabbix-backup.service
    - zabbix-backup.timer

- name: Enable daily backups
  ansible.builtin.systemd_service:
    name: zabbix-backup.timer
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
