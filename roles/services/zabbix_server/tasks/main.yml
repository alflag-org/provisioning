---
- name: Require credentials before preparing the server
  ansible.builtin.assert:
    that:
      - zabbix_db_password | default('') | length >= 24
      - zabbix_db_password is not search('[\r\n]')
      - zabbix_db_password == zabbix_db_password | trim
      - "'\u0000' not in zabbix_db_password"
      - zabbix_admin_password | default('') | length >= 24
      - zabbix_admin_password != 'zabbix'
      - zabbix_frontend_certificate | default('') is search('BEGIN CERTIFICATE')
      - zabbix_frontend_private_key | default('') is search('PRIVATE KEY')
      - zabbix_database is match('^[a-z][a-z0-9_]*$')
  no_log: true

- name: Configure the official RC2 repository
  ansible.builtin.include_role:
    name: components/zabbix_repository  # noqa role-name[path]
    public: true

- name: Inspect installed packages before selecting any change
  ansible.builtin.package_facts:
    manager: apt

- name: Require the inventory runtime to match the supported OS combination
  ansible.builtin.assert:
    that:
      - zabbix_postgresql_version | string == zabbix_server_platform.postgresql
      - zabbix_php_version | string == zabbix_server_platform.php
    fail_msg: Select the PostgreSQL and PHP versions supported for this Ubuntu release.

- name: Refuse implicit server or schema upgrades
  ansible.builtin.assert:
    that:
      - item not in ansible_facts.packages or ansible_facts.packages[item][0].version == zabbix_package_version
    fail_msg: Version changes require a reviewed release change and a fresh monitoring VM.
  loop: "{{ zabbix_server_packages }}"

- name: Install PostgreSQL, PHP and the exact RC2 packages without auto-start
  ansible.builtin.apt:
    name: >-
      {{ zabbix_server_packages | map('regex_replace', '$', '=' ~ zabbix_package_version) | list
         + ['postgresql-' ~ zabbix_postgresql_version, 'postgresql-client-' ~ zabbix_postgresql_version,
            'python3-psycopg2', 'nftables']
         + (['fpm', 'pgsql', 'mbstring', 'bcmath', 'xml', 'gd', 'ldap', 'curl']
            | map('regex_replace', '^', 'php' ~ zabbix_php_version ~ '-') | list) }}
    state: present
    policy_rc_d: 101
    install_recommends: false
  when: not ansible_check_mode or zabbix_repository_existing.stat.exists

- name: Inspect server prerequisites for check mode
  ansible.builtin.stat:
    path: /usr/share/zabbix/sql-scripts/postgresql/server.sql.gz
  register: zabbix_server_schema_file

- name: Explain deferred initialization on a fresh host
  ansible.builtin.debug:
    msg: Database, frontend and API initialization require the pinned packages during apply.
  changed_when: true
  when:
    - ansible_check_mode
    - not zabbix_server_schema_file.stat.exists

- name: Configure installed monitoring components
  when: not ansible_check_mode or zabbix_server_schema_file.stat.exists
  block:
    - name: Prepare dedicated PostgreSQL
      ansible.builtin.import_tasks: database.yml

    - name: Prepare server and private frontend
      ansible.builtin.import_tasks: frontend.yml

    - name: Configure enrolled-agent ingress
      ansible.builtin.import_tasks: ingress.yml

    - name: Enable Zabbix server after configuration and bootstrap
      ansible.builtin.systemd_service:
        name: zabbix-server
        state: "{{ 'restarted' if zabbix_server_configuration.changed or zabbix_server_ingress_dependency.changed else 'started' }}"
        enabled: true
        daemon_reload: true
      when: not ansible_check_mode
