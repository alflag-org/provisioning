---
services_netbox_enabled: true
services_netbox_version: "4.6.7"
services_netbox_root: /opt/netbox
services_netbox_release_dir: "/opt/netbox-{{ services_netbox_version }}"
services_netbox_release_archive_path: "/var/cache/netbox-{{ services_netbox_version }}.tar.gz"
services_netbox_release_url: "https://github.com/netbox-community/netbox/archive/refs/tags/v{{ services_netbox_version }}.tar.gz"

services_netbox_user: netbox
services_netbox_group: netbox
services_netbox_python_binary: /usr/bin/python3
services_netbox_venv_path: "{{ services_netbox_root }}/venv"
services_netbox_upgrade_marker_path: "{{ services_netbox_release_dir }}/.provisioning-upgrade-complete"
services_netbox_configuration_path: "{{ services_netbox_root }}/netbox/netbox/configuration.py"
services_netbox_gunicorn_config_path: "{{ services_netbox_root }}/gunicorn.py"
services_netbox_static_path: "{{ services_netbox_root }}/netbox/static"
services_netbox_media_path: "{{ services_netbox_root }}/netbox/media"
services_netbox_reports_path: "{{ services_netbox_root }}/netbox/reports"
services_netbox_scripts_path: "{{ services_netbox_root }}/netbox/scripts"

services_netbox_gunicorn_bind_address: 127.0.0.1
services_netbox_gunicorn_port: 8001
services_netbox_gunicorn_workers: 5
services_netbox_gunicorn_threads: 3
services_netbox_gunicorn_timeout: 120
services_netbox_gunicorn_max_requests: 5000
services_netbox_gunicorn_max_requests_jitter: 500

services_netbox_service_name: netbox.service
services_netbox_worker_service_name: netbox-rq.service
services_netbox_required_services:
  - postgresql.service
  - redis-server.service
  - "{{ services_netbox_service_name }}"
  - "{{ services_netbox_worker_service_name }}"

services_netbox_postgresql_package: postgresql
services_netbox_postgresql_service_name: postgresql
services_netbox_postgresql_hba_path: ""
services_netbox_database_host: 127.0.0.1
services_netbox_database_port: 5432
services_netbox_database_name: netbox
services_netbox_database_user: netbox

services_netbox_redis_package: redis-server
services_netbox_redis_service_name: redis-server
services_netbox_redis_config_path: /etc/redis/redis.conf
services_netbox_redis_host: 127.0.0.1
services_netbox_redis_port: 6379
services_netbox_redis_database: 0
services_netbox_redis_cache_database: 1
services_netbox_redis_bind: "127.0.0.1 ::1"

services_netbox_system_packages:
  - build-essential
  - ca-certificates
  - libffi-dev
  - libpq-dev
  - libssl-dev
  - libxml2-dev
  - libxslt1-dev
  - "{{ services_netbox_postgresql_package }}"
  - python3
  - python3-dev
  - python3-pip
  - python3-psycopg2
  - python3-venv
  - "{{ services_netbox_redis_package }}"
  - zlib1g-dev

services_netbox_timezone: Asia/Tokyo
services_netbox_allowed_hosts:
  - "{{ network_primary_fqdn | default(inventory_hostname) }}"
  - "{{ inventory_hostname }}"
  - "{{ network_ipv4_address | default(ansible_host) }}"
  - localhost
  - 127.0.0.1

services_netbox_caddy_fragment_name: netbox.caddy
services_netbox_caddy_site_addresses:
  - "{{ network_primary_fqdn | default(inventory_hostname) }}"
  - "{{ inventory_hostname }}"
  - "{{ network_ipv4_address | default(ansible_host) }}"
services_netbox_caddy_static_path: /static/netbox.js
services_netbox_frontend_health_address: "{{ network_ipv4_address | default(ansible_host) }}"
services_netbox_health_path: /login/
services_netbox_health_retries: 60
services_netbox_health_delay: 5
