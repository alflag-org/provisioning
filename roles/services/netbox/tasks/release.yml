---
- name: Check the current NetBox path
  ansible.builtin.stat:
    path: "{{ services_netbox_root }}"
    follow: false
  register: services_netbox_root_stat

- name: Refuse to replace an existing non-symlink NetBox path
  ansible.builtin.assert:
    that:
      - not services_netbox_root_stat.stat.exists or services_netbox_root_stat.stat.islnk
    fail_msg: >-
      {{ services_netbox_root }} already exists as a directory or regular file. Refusing to replace it
      automatically; inspect the existing deployment before switching to native NetBox.

- name: Ensure the NetBox system group exists
  ansible.builtin.group:
    name: "{{ services_netbox_group }}"
    system: true

- name: Ensure the NetBox system user exists
  ansible.builtin.user:
    name: "{{ services_netbox_user }}"
    group: "{{ services_netbox_group }}"
    home: "{{ services_netbox_root }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Ensure the versioned NetBox release directory exists
  ansible.builtin.file:
    path: "{{ services_netbox_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Download the pinned NetBox release archive
  ansible.builtin.get_url:
    url: "{{ services_netbox_release_url }}"
    dest: "{{ services_netbox_release_archive_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Extract the pinned NetBox release
  ansible.builtin.unarchive:
    src: "{{ services_netbox_release_archive_path }}"
    dest: "{{ services_netbox_release_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ services_netbox_release_dir }}/upgrade.sh"
  when: not ansible_check_mode

- name: Point the stable NetBox path at the pinned release
  ansible.builtin.file:
    src: "{{ services_netbox_release_dir }}"
    dest: "{{ services_netbox_root }}"
    state: link
    owner: root
    group: root
    force: false
  register: services_netbox_current_link
  when: not ansible_check_mode

- name: Ensure NetBox writable directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ services_netbox_user }}"
    group: "{{ services_netbox_group }}"
    mode: "0755"
  loop:
    - "{{ services_netbox_media_path }}"
    - "{{ services_netbox_reports_path }}"
    - "{{ services_netbox_scripts_path }}"
    - "{{ services_netbox_static_path }}"
  when: not ansible_check_mode

- name: Restore ownership of NetBox writable directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ services_netbox_user }}"
    group: "{{ services_netbox_group }}"
    mode: "0755"
  loop:
    - "{{ services_netbox_media_path }}"
    - "{{ services_netbox_reports_path }}"
    - "{{ services_netbox_scripts_path }}"
    - "{{ services_netbox_static_path }}"
  when: not ansible_check_mode
