---
- name: Validate the complete Caddy configuration
  ansible.builtin.command:
    argv:
      - "{{ caddy_binary }}"
      - validate
      - --config
      - "{{ caddy_config_path }}"
      - --adapter
      - caddyfile
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Check NetBox dependency and frontend service activity
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item }}"
  loop: "{{ services_netbox_required_services + [caddy_service_name ~ '.service'] }}"
  register: services_netbox_service_activity
  changed_when: false
  check_mode: false
  failed_when: false
  when: not ansible_check_mode

- name: Require NetBox dependency and frontend services to be active
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim == 'active'
    fail_msg: "{{ item.item }} is not active."
  loop: "{{ services_netbox_service_activity.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Check NetBox dependency and frontend service enablement
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ item }}"
  loop: "{{ services_netbox_required_services + [caddy_service_name ~ '.service'] }}"
  register: services_netbox_service_enablement
  changed_when: false
  check_mode: false
  failed_when: false
  when: not ansible_check_mode

- name: Require NetBox dependency and frontend services to be enabled
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim in ['enabled', 'enabled-runtime']
    fail_msg: "{{ item.item }} is not enabled."
  loop: "{{ services_netbox_service_enablement.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Verify Gunicorn listens only on the loopback address
  ansible.builtin.command: ss -ltn
  register: services_netbox_listening_sockets
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require the loopback Gunicorn listener
  ansible.builtin.assert:
    that:
      - services_netbox_listening_sockets.stdout is search('127\\.0\\.0\\.1:' ~ (services_netbox_gunicorn_port | string))
    fail_msg: >-
      Gunicorn is not listening on the required loopback address
      127.0.0.1:{{ services_netbox_gunicorn_port }}.
  when: not ansible_check_mode

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  when: not ansible_check_mode

- name: Require nginx to be absent from the NetBox host
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.packages.keys()
        | select('match', '^nginx($|-)')
        | list
        | length == 0
    fail_msg: "nginx packages are installed on the NetBox host."
  when: not ansible_check_mode

- name: Verify the NetBox login page through Caddy
  ansible.builtin.uri:
    url: "http://{{ services_netbox_frontend_health_address }}{{ services_netbox_health_path }}"
    headers:
      Host: "{{ services_netbox_caddy_site_addresses[0] }}"
    method: GET
    status_code: 200
    timeout: 10
  register: services_netbox_frontend_health_check
  changed_when: false
  check_mode: false
  retries: "{{ services_netbox_health_retries }}"
  delay: "{{ services_netbox_health_delay }}"
  until: services_netbox_frontend_health_check.status | default(0) == 200
  when: not ansible_check_mode

- name: Verify NetBox static files through Caddy
  ansible.builtin.uri:
    url: "http://{{ services_netbox_frontend_health_address }}{{ services_netbox_caddy_static_path }}"
    headers:
      Host: "{{ services_netbox_caddy_site_addresses[0] }}"
    method: GET
    status_code: 200
    timeout: 10
  register: services_netbox_static_health_check
  changed_when: false
  check_mode: false
  retries: "{{ services_netbox_health_retries }}"
  delay: "{{ services_netbox_health_delay }}"
  until: services_netbox_static_health_check.status | default(0) == 200
  when: not ansible_check_mode
