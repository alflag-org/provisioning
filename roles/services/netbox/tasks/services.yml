---
- name: Render the official NetBox WSGI unit
  ansible.builtin.template:
    src: netbox.service.j2
    dest: "/etc/systemd/system/{{ netbox_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart NetBox services

- name: Render the official NetBox RQ unit
  ansible.builtin.template:
    src: netbox-rq.service.j2
    dest: "/etc/systemd/system/{{ netbox_worker_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart NetBox services

- name: Enable and start NetBox services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - "{{ netbox_service_name }}"
    - "{{ netbox_worker_service_name }}"
  when: not ansible_check_mode

- name: Apply pending NetBox service handlers
  ansible.builtin.meta: flush_handlers
