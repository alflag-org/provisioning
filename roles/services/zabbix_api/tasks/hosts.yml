---
- name: Require strong distinct keys for the explicitly enrolled agents
  ansible.builtin.assert:
    that:
      - zabbix_agent_psks[item] is match('^[0-9a-fA-F]{64,512}$')
      - zabbix_agent_psks[item] | length % 2 == 0
      - zabbix_agent_psks.values() | list | unique | length == zabbix_agent_psks | length
  loop: "{{ groups['svc_zabbix_agent'] }}"
  no_log: true

- name: Read existing host metadata without exposing secret macros
  community.zabbix.zabbix_host_info:
  register: zabbix_api_existing_hosts
  no_log: true

- name: Register explicitly enrolled agents from inventory
  ansible.builtin.include_tasks: agent.yml
  loop: "{{ groups['svc_zabbix_agent'] | sort }}"
  loop_control:
    loop_var: zabbix_target

- name: Register explicitly declared remote targets
  ansible.builtin.include_tasks: remote.yml
  loop: "{{ groups['zabbix_remote_targets'] | sort }}"
  loop_control:
    loop_var: zabbix_target
