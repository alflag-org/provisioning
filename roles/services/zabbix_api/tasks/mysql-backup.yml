---
- name: Read the existing MySQL backup status through its restricted local reader
  community.zabbix.zabbix_item:
    host_name: "{{ zabbix_target }}"
    name: MySQL backup completion status
    params:
      key: mysql.backup.status
      type: zabbix_agent_active
      value_type: text
      interval: 60s
      history: 30d

- name: Measure the age and integrity of the last MySQL backup
  community.zabbix.zabbix_item:
    host_name: "{{ zabbix_target }}"
    name: MySQL backup age
    params:
      key: mysql.backup.age
      type: dependent_item
      value_type: numeric_unsigned
      history: 30d
      trends: 365d
      units: s
      master_item:
        host_name: "{{ zabbix_target }}"
        item_name: MySQL backup completion status
      preprocessing:
        - type: javascript
          params: |
            var status = JSON.parse(value), now = Date.now();
            var success = Date.parse(status.last_success || ''), failure = Date.parse(status.last_failure || '');
            if (!isFinite(success) || (isFinite(failure) && failure > success) ||
                    !status.storage_success || !status.local_validation_success) { return 4294967295; }
            return Math.max(0, Math.floor((now - success) / 1000));
          error_handler: zabbix_server
          error_handler_params: ""

- name: Alert when a MySQL backup fails or stops completing
  community.zabbix.zabbix_trigger:
    host_name: "{{ zabbix_target }}"
    name: MySQL backup failed or stale
    params:
      expression: >-
        last(/{{ zabbix_target }}/mysql.backup.age)>26h or
        nodata(/{{ zabbix_target }}/mysql.backup.age,10m)=1
      severity: high
