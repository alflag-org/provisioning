---
- name: Preserve network history when changing template assignments
  no_log: true
  vars:
    zabbix_network_existing_host: >-
      {{ zabbix_api_existing_hosts.hosts | selectattr('host', 'equalto', zabbix_target)
         | first | default({}) }}
    zabbix_network_existing_templates: >-
      {{ zabbix_api_existing_hosts.hosts | selectattr('host', 'equalto', zabbix_target)
         | map(attribute='parentTemplates') | flatten | map(attribute='name') | list }}
  ansible.builtin.assert:
    that:
      - >-
        zabbix_network_prepared | default(false) | bool or
        zabbix_network_existing_templates | difference(hostvars[zabbix_target].zabbix_monitor_templates) | length == 0
      - >-
        zabbix_network_existing_host | zabbix_unmanaged_icmp_macros(
          hostvars[zabbix_target].zabbix_monitor_macros | default([]) | map(attribute='macro') | list) | length == 0
      - >-
        'Network Generic Device by SNMP' not in hostvars[zabbix_target].zabbix_monitor_templates or
        zabbix_network_prepared | default(false) | bool or
        'Network Generic Device by SNMP' in zabbix_network_existing_templates
    fail_msg: Run zabbix-network.yml for initial SNMP enrollment; review template removal without clearing history.
  when: zabbix_target in groups.get('zabbix_network_devices', [])

- name: Validate remote monitoring credentials before registration
  ansible.builtin.import_tasks: remote-validate.yml

- name: Register explicitly declared remote targets
  community.zabbix.zabbix_host:
    host_name: "{{ zabbix_target }}"
    host_groups: [Provisioning]
    link_templates: "{{ hostvars[zabbix_target].zabbix_monitor_templates }}"
    interfaces: "{{ hostvars[zabbix_target].zabbix_monitor_interfaces | default([]) }}"
    macros: "{{ hostvars[zabbix_target].zabbix_monitor_macros | default([]) }}"
    tags:
      - tag: managed-by
        value: provisioning
      - tag: role
        value: "{{ hostvars[zabbix_target].zabbix_monitor_role }}"
    state: present
  no_log: true
