---
# zabbix_host clears removed templates. Explicit unlink-and-keep must precede it.
- name: Unlink the old ICMP template without clearing collected history
  ansible.builtin.uri:
    body:
      jsonrpc: '2.0'
      method: host.update
      params:
        hostid: >-
          {{ (zabbix_network_hosts.json.result
              | selectattr('host', 'equalto', zabbix_network_target) | first).hostid }}
        templates: []
      id: 20
  register: zabbix_network_unlink
  failed_when: zabbix_network_unlink.json.result is not defined
  changed_when: true
  when:
    - not ansible_check_mode
    - zabbix_network_plans[zabbix_network_target].unlink

- name: Align retained ICMP trigger names before the standard template adopts them
  ansible.builtin.uri:
    body:
      jsonrpc: '2.0'
      method: trigger.update
      params: "{{ zabbix_network_plans[zabbix_network_target].renames }}"
      id: 21
  register: zabbix_network_rename
  failed_when: zabbix_network_rename.json.result is not defined
  changed_when: true
  when:
    - not ansible_check_mode
    - zabbix_network_plans[zabbix_network_target].renames | length > 0
