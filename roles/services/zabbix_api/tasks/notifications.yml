---
- name: Require the intended notification endpoint
  ansible.builtin.assert:
    that:
      - groups['svc_zabbix_server'] == ['monitor01']
      - zabbix_discord_webhook | default('') is match('^https://discord.com/api/webhooks/[^\s]+$')
  no_log: true

- name: Configure notification links
  community.zabbix.zabbix_globalmacro:
    macro_name: ZABBIX.URL
    macro_value: "http://{{ zabbix_frontend_name }}"

- name: Prepare a read-only notification group
  community.zabbix.zabbix_usergroup:
    name: Provisioning notifications
    gui_access: disable
    hostgroup_rights:
      - host_group: Provisioning
        permission: read-only

- name: Configure the Discord recipient with the packaged official media type
  community.zabbix.zabbix_user:
    username: provisioning-notifications
    usrgrps: [Provisioning notifications]
    role_name: User role
    # The recipient cannot log into the frontend. Only creation sets this password.
    passwd: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
    override_passwd: false
    user_medias:
      - mediatype: Discord
        sendto: "{{ zabbix_discord_webhook }}"
        severity:
          not_classified: false
          information: false
          warning: true
          average: true
          high: true
          disaster: true
  no_log: true

- name: Notify once for problems and once for their recovery
  community.zabbix.zabbix_action:
    name: Provisioning Discord problems and recovery
    event_source: trigger
    status: enabled
    esc_period: 1h
    pause_in_maintenance: true
    conditions:
      - type: host_group
        operator: '='
        value: Provisioning
      - type: trigger_severity
        operator: '>='
        value: warning
    eval_type: and
    operations:
      - type: send_message
        send_to_users: [provisioning-notifications]
        media_type: Discord
        esc_step_from: 1
        esc_step_to: 1
    recovery_operations:
      - type: notify_all_involved

# The collection's media-type module requires a script and replaces other webhook
# fields. Update only status so the packaged implementation remains intact.
- name: Enable the packaged Discord media type after configuring delivery
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_become: false
    zabbix_notification_api_url: "http://{{ hostvars[inventory_hostname].ansible_host }}/api_jsonrpc.php"
  no_log: true
  block:
    - name: Authenticate notification media configuration
      ansible.builtin.uri:
        url: "{{ zabbix_notification_api_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: user.login
          params:
            username: "{{ ansible_user }}"
            password: "{{ zabbix_admin_password }}"
      register: zabbix_notification_login
      failed_when: zabbix_notification_login.json.result is not defined
      check_mode: false

    - name: Read the packaged Discord media identity and state
      ansible.builtin.uri:
        url: "{{ zabbix_notification_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_notification_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 2
          method: mediatype.get
          params:
            output: [mediatypeid, type, status]
            filter:
              name: Discord
      register: zabbix_notification_media
      failed_when: zabbix_notification_media.json.result is not defined
      check_mode: false

    - name: Require the existing official Discord webhook
      ansible.builtin.assert:
        that:
          - zabbix_notification_media.json.result | length == 1
          - zabbix_notification_media.json.result[0].type == '4'

    - name: Report media activation in check mode
      ansible.builtin.debug:
        msg: The packaged Discord media type would be enabled.
      changed_when: true
      when:
        - ansible_check_mode
        - zabbix_notification_media.json.result[0].status != '0'

    - name: Enable Discord without replacing its script or parameters
      ansible.builtin.uri:
        url: "{{ zabbix_notification_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_notification_login.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 3
          method: mediatype.update
          params:
            mediatypeid: "{{ zabbix_notification_media.json.result[0].mediatypeid }}"
            status: "0"
      register: zabbix_notification_media_update
      failed_when: zabbix_notification_media_update.json.result is not defined
      changed_when: true
      when:
        - not ansible_check_mode
        - zabbix_notification_media.json.result[0].status != '0'
  always:
    - name: Close the notification media configuration session
      ansible.builtin.uri:
        url: "{{ zabbix_notification_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ zabbix_notification_login.json.result }}"
        body_format: json
        body: {jsonrpc: "2.0", id: 4, method: user.logout, params: []}
      register: zabbix_notification_logout
      failed_when: zabbix_notification_logout.json.result is not defined
      check_mode: false
      when: zabbix_notification_login.json.result is defined
