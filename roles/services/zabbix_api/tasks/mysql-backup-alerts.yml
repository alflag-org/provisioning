---
- name: Reset derived backup source selection for this invocation
  ansible.builtin.set_fact:
    zabbix_api_backup_targets: []

- name: Select declared ReplicaSet backup sources from current inventory
  ansible.builtin.set_fact:
    zabbix_api_backup_targets: "{{ zabbix_api_backup_targets + [item] }}"
  loop: "{{ groups.get('svc_mysql', []) | sort }}"
  when: hostvars[item].mysql_backup_enabled | default(false) | bool

- name: Monitor the declared ReplicaSet as one backup source
  when: zabbix_api_backup_targets | length > 0
  block:
    - name: Require both enrolled ReplicaSet members for aggregate backup evidence
      ansible.builtin.assert:
        that:
          - zabbix_api_backup_targets | length == 2
          - zabbix_api_backup_targets | difference(groups['svc_zabbix_agent']) | length == 0

    - name: Track the latest completion and failure across both members
      community.zabbix.zabbix_item:
        host_name: "{{ inventory_hostname }}"
        name: "MySQL ReplicaSet latest {{ 'completed backup' if item == 'last_success' else 'failed backup attempt' }} timestamp"
        params:
          key: "mysql.replicaset.backup.{{ item }}"
          type: calculated
          value_type: numeric_unsigned
          interval: 60s
          history: 30d
          trends: 365d
          units: unixtime
          description: >-
            Latest recorded timestamp across both members; zero means explicitly no recorded event.
            A completed backup does not prove restoration or off-site recovery.
          params: >-
            max({% for peer in zabbix_api_backup_targets %}last(/{{ peer }}/mysql.backup.{{ item }}){{ ',' if not loop.last else '' }}{% endfor %})
      loop: [last_success, last_failure]

    - name: Alert when recorded backup evidence becomes unavailable
      community.zabbix.zabbix_trigger:
        host_name: "{{ inventory_hostname }}"
        name: MySQL ReplicaSet backup status is unavailable
        params:
          expression: >-
            {% for peer in zabbix_api_backup_targets %}
            nodata(/{{ peer }}/mysql.backup.last_success,10m)=1 or
            nodata(/{{ peer }}/mysql.backup.last_failure,10m)=1
            {{ ' or ' if not loop.last else '' }}
            {% endfor %}
          severity: high

    - name: Alert on failures newer than every completed ReplicaSet backup
      community.zabbix.zabbix_trigger:
        host_name: "{{ inventory_hostname }}"
        name: MySQL ReplicaSet latest backup attempt failed
        params:
          expression: >-
            last(/{{ inventory_hostname }}/mysql.replicaset.backup.last_failure)>
            last(/{{ inventory_hostname }}/mysql.replicaset.backup.last_success)
          severity: high
        dependencies:
          - host_name: "{{ inventory_hostname }}"
            name: MySQL ReplicaSet backup status is unavailable

    - name: Alert when the ReplicaSet has no recent completed backup
      community.zabbix.zabbix_trigger:
        host_name: "{{ inventory_hostname }}"
        name: MySQL ReplicaSet has no recent completed backup
        params:
          expression: >-
            last(/{{ inventory_hostname }}/mysql.replicaset.backup.last_success)=0 or
            now()-last(/{{ inventory_hostname }}/mysql.replicaset.backup.last_success)>26h
          severity: high
        dependencies:
          - host_name: "{{ inventory_hostname }}"
            name: MySQL ReplicaSet backup status is unavailable
          - host_name: "{{ inventory_hostname }}"
            name: MySQL ReplicaSet latest backup attempt failed
