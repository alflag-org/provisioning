---
- name: Converge authoritative DNS
  when: dns_authoritative_enabled | bool
  block:
    - name: Install authoritative DNS package
      ansible.builtin.apt:
        name: "{{ dns_authoritative_package }}"
        state: present
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
        policy_rc_d: "{{ 101 if dns_authoritative_zones | length == 0 else omit }}"
      become: true

    - name: Ensure authoritative DNS zone directory exists
      ansible.builtin.file:
        path: "{{ dns_authoritative_zone_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure the authoritative DNS runtime record directory exists
      ansible.builtin.file:
        path: "{{ dns_authoritative_runtime_dir }}"
        state: directory
        owner: root
        group: nsd
        mode: "0750"

    - name: Preserve or seed the MySQL runtime role records
      ansible.builtin.copy:
        content: "; Runtime MySQL role records are populated from ReplicaSet status.\n"
        dest: "{{ dns_authoritative_mysql_role_record_path }}"
        owner: root
        group: nsd
        mode: "0640"
        force: false

    - name: Install the atomic MySQL role DNS updater
      ansible.builtin.copy:
        src: update-mysql-role-dns.py
        dest: "{{ dns_authoritative_runtime_update_program_path }}"
        owner: root
        group: root
        mode: "0750"

    - name: Check manual authoritative DNS zone files
      ansible.builtin.stat:
        path: "{{ item.file | default(dns_authoritative_zone_dir ~ '/' ~ item.name ~ '.zone') }}"
      loop: "{{ dns_authoritative_zones }}"
      register: dns_authoritative_zone_file_stats
      when:
        - not (item.managed | default(false) | bool)
        - item.text is not defined
        - not ansible_check_mode

    - name: Require manual authoritative DNS zone files
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Authoritative DNS zone file is not managed by this provisioning repository and is missing on
          {{ inventory_hostname }}: {{ item.stat.path }}. Place the zone file manually
          or provide explicit zone text in dns_authoritative_zones.
      loop: "{{ dns_authoritative_zone_file_stats.results | default([]) }}"
      when:
        - item.stat is defined
        - not ansible_check_mode

    - name: Render authoritative DNS zones from explicit text
      ansible.builtin.copy:
        content: "{{ item.text }}"
        dest: "{{ item.file | default(dns_authoritative_zone_dir ~ '/' ~ item.name ~ '.zone') }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ dns_authoritative_zones }}"
      notify: Restart nsd
      when:
        - not (item.managed | default(false) | bool)
        - item.text is defined

    - name: Render managed authoritative DNS zones
      ansible.builtin.include_tasks:
        file: managed_zone.yml
      loop: "{{ dns_authoritative_zones }}"
      loop_control:
        loop_var: dns_authoritative_managed_zone
      when:
        - dns_authoritative_managed_zone.managed | default(false) | bool

    - name: Render authoritative DNS configuration
      ansible.builtin.template:
        src: nsd.conf.j2
        dest: "{{ dns_authoritative_config_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart nsd

    # The root configuration is complete and has no includes of legacy snippets.
    - name: Remove retired DNS configuration and zone files
      ansible.builtin.include_role:
        name: resource_cleanup
        tasks_from: paths.yml
      vars:
        resource_cleanup_paths: "{{ dns_authoritative_retired_paths }}"

    - name: Validate NSD configuration
      ansible.builtin.command:
        cmd: "nsd-checkconf {{ dns_authoritative_config_path }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Validate authoritative DNS zones
      ansible.builtin.command:
        cmd: "nsd-checkzone {{ item.name }} {{ item.file | default(dns_authoritative_zone_dir ~ '/' ~ item.name ~ '.zone') }}"
      loop: "{{ dns_authoritative_zones }}"
      changed_when: false
      when:
        - dns_authoritative_zones | length > 0
        - not ansible_check_mode

    - name: Enable and start NSD when zones are configured
      ansible.builtin.systemd_service:
        name: "{{ dns_authoritative_service_name }}"
        state: started
        enabled: true
      when:
        - dns_authoritative_zones | length > 0
        - not ansible_check_mode

    - name: Apply pending NSD handlers
      ansible.builtin.meta: flush_handlers
      when: dns_authoritative_zones | length > 0

    - name: Leave NSD service external until zones are configured
      ansible.builtin.debug:
        msg: "dns_authoritative_enabled=true, but dns_authoritative_zones is empty; NSD service is not started by this provisioning repository."
        verbosity: 1
      when: dns_authoritative_zones | length == 0
