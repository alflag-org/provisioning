---
- name: Gather service facts for retired monitoring cleanup
  ansible.builtin.service_facts:
  when: retired_monitoring_cleanup_enabled | bool

- name: Stop retired monitoring services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ retired_monitoring_cleanup_services }}"
  vars:
    retired_monitoring_cleanup_service: >-
      {{ ansible_facts.services.get(item ~ '.service', {}) }}
  when:
    - retired_monitoring_cleanup_enabled | bool
    - not ansible_check_mode
    - retired_monitoring_cleanup_service | length > 0
    - retired_monitoring_cleanup_service.status | default('') != 'not-found'

- name: Purge retired monitoring packages
  ansible.builtin.apt:
    name: "{{ retired_monitoring_cleanup_packages }}"
    state: absent
    purge: true
    autoremove: true
  when: retired_monitoring_cleanup_enabled | bool

- name: Remove retired monitoring paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ retired_monitoring_cleanup_paths }}"
  when: retired_monitoring_cleanup_enabled | bool
