---
- name: Create swap file
  ansible.builtin.command: dd if=/dev/zero of="{{ swap_file_path }}" bs=1M count={{ swap_file_size_mb }}
  become: true
  when: not swap_file.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: 0600
  become: true
  when: not swap_file.stat.exists

- name: Make swap file
  ansible.builtin.command: mkswap "{{ swap_file_path }}"
  become: true
  when: not swap_file.stat.exists

- name: Persist swap file in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap_file_path | regex_escape() }}\\s+"
    line: "{{ swap_file_path }} none swap sw 0 0"
    state: present
  become: true

- name: Enable swap file
  ansible.builtin.command: swapon "{{ swap_file_path }}"
  become: true
  when: not swap_file.stat.exists
