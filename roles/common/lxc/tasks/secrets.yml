---
- name: Check local secrets source
  ansible.builtin.stat:
    path: "{{ common_lxc_secrets_source }}"
  delegate_to: localhost
  become: false
  register: common_lxc_secrets_source_stat

- name: Require local secrets source
  ansible.builtin.assert:
    that:
      - common_lxc_secrets_source_stat.stat.isdir | default(false)
    fail_msg: >-
      Local secrets source is missing or not a directory: {{ common_lxc_secrets_source }}.
      Create it or override common_lxc_secrets_source before converging LXC hosts.
  when: common_lxc_secrets_required | bool

- name: Ensure operator secrets directory exists
  ansible.builtin.file:
    path: "{{ common_operator_home }}/secrets"
    state: directory
    owner: "{{ common_operator_user }}"
    group: "{{ common_operator_group }}"
    mode: "0700"
  become: true
  when: common_lxc_secrets_source_stat.stat.isdir | default(false)

- name: Copy secrets
  ansible.builtin.copy:
    src: "{{ common_lxc_secrets_source }}/"
    dest: "{{ common_operator_home }}/secrets/"
    owner: "{{ common_operator_user }}"
    group: "{{ common_operator_group }}"
    mode: preserve
    directory_mode: "0700"
  become: true
  when: common_lxc_secrets_source_stat.stat.isdir | default(false)

- name: Ensure synced secrets are owned by the LXC operator
  ansible.builtin.file:
    path: "{{ common_operator_home }}/secrets"
    state: directory
    owner: "{{ common_operator_user }}"
    group: "{{ common_operator_group }}"
    recurse: true
  become: true
  when: common_lxc_secrets_source_stat.stat.isdir | default(false)
