---
- name: Install OpenSSH server
  ansible.builtin.include_role:
    name: apt_state
  vars:
    apt_state_packages: openssh-server
  when: ssh_server_enabled | bool

- name: Validate SSH TCP forwarding policy
  ansible.builtin.assert:
    that:
      - ssh_server_allow_tcp_forwarding is string
      - ssh_server_allow_tcp_forwarding in ['no', 'local', 'yes']
    fail_msg: >-
      ssh_server_allow_tcp_forwarding must be the string no, local, or yes.
    quiet: true
  when: ssh_server_enabled | bool

- name: Check sshd drop-in directory
  ansible.builtin.stat:
    path: "{{ ssh_server_config_dropin_dir }}"
  register: ssh_server_dropin_dir
  when: ssh_server_enabled | bool

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: "{{ ssh_server_config_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_server_enabled | bool

- name: Render managed sshd policy drop-in
  ansible.builtin.template:
    src: alflag.conf.j2
    dest: "{{ ssh_server_config_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH service
  when:
    - ssh_server_enabled | bool
    - not ansible_check_mode or ssh_server_dropin_dir.stat.exists

- name: Validate sshd configuration
  ansible.builtin.command:
    cmd: "{{ ssh_server_sshd_binary }} -t"
  changed_when: false
  when:
    - ssh_server_enabled | bool
    - not ansible_check_mode

- name: Enable and start SSH service
  ansible.builtin.service:
    name: "{{ ssh_server_service_name }}"
    state: started
    enabled: true
  when:
    - ssh_server_enabled | bool
    - not ansible_check_mode

- name: Apply pending SSH service handlers
  ansible.builtin.meta: flush_handlers
  when: ssh_server_enabled | bool
