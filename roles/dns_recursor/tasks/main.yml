---
- name: Converge recursive DNS
  when: dns_recursor_enabled | bool
  block:
    - name: Install recursive DNS packages
      ansible.builtin.apt:
        name: "{{ dns_recursor_package }}"
        state: present
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
      become: true

    - name: Ensure Unbound configuration directory exists
      ansible.builtin.file:
        path: "{{ dns_recursor_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render recursive DNS configuration
      ansible.builtin.template:
        src: alflag-recursive.conf.j2
        dest: "{{ dns_recursor_config_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart unbound

    # The root configuration is complete and has no includes of legacy snippets.
    - name: Remove retired DNS configuration snippets
      ansible.builtin.include_role:
        name: resource_cleanup
        tasks_from: paths.yml
      vars:
        resource_cleanup_paths: "{{ dns_recursor_retired_config_paths }}"

    - name: Validate Unbound configuration
      ansible.builtin.command:
        cmd: unbound-checkconf
      changed_when: false
      when: not ansible_check_mode

    - name: Enable and start Unbound
      ansible.builtin.systemd_service:
        name: "{{ dns_recursor_service_name }}"
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Apply pending Unbound handlers
      ansible.builtin.meta: flush_handlers
