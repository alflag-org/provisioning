---
dns_recursor_enabled: false
dns_recursor_package: unbound
dns_recursor_service_name: unbound
dns_recursor_config_dir: /etc/unbound
dns_recursor_config_path: "{{ dns_recursor_config_dir }}/unbound.conf"
dns_recursor_listen_addresses:
  - "127.0.0.1"
dns_recursor_allowed_cidrs:
  - 127.0.0.0/8
dns_recursor_stub_zones: []
dns_recursor_forward_zones: []
dns_recursor_retired_config_paths: []
dns_recursor_trust_anchor_file: /var/lib/unbound/root.key
dns_recursor_control_socket: /run/unbound.ctl
dns_recursor_control_enabled: false
dns_recursor_prefetch: false
dns_recursor_cache_min_ttl: 0
dns_recursor_cache_max_ttl: 86400
dns_recursor_unwanted_reply_threshold: 0
