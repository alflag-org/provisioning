---
zabbix_server_supported_lsb_releases:
  - "22.04"
  - "24.04"
  - "26.04"

zabbix_server_major_versions:
  "22.04": "6.0"
  "24.04": "7.0"
  "26.04": "7.0"
zabbix_server_major_version: >-
  {{ zabbix_server_major_versions.get(
    ansible_facts.get('distribution_version', ''),
    '7.0'
  ) }}
zabbix_server_manage_repository: true
zabbix_server_repository_deb_urls:
  "22.04": >-
    https://repo.zabbix.com/zabbix/6.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_6.0+ubuntu22.04_all.deb
  "24.04": >-
    https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
  "26.04": >-
    https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu26.04_all.deb
zabbix_server_repository_deb_url: >-
  {{ zabbix_server_repository_deb_urls.get(
    ansible_facts.get('distribution_version', ''),
    ''
  ) }}

zabbix_server_php_versions:
  "22.04": "8.1"
  "24.04": "8.3"
  "26.04": "8.5"
zabbix_server_php_version: >-
  {{ zabbix_server_php_versions.get(
    ansible_facts.get('distribution_version', ''),
    '8.3'
  ) }}
zabbix_server_php_fpm_service_name: "php{{ zabbix_server_php_version }}-fpm"
zabbix_server_php_fpm_ini_dir: "/etc/php/{{ zabbix_server_php_version }}/fpm/conf.d"
zabbix_server_php_fpm_zabbix_ini_path: "{{ zabbix_server_php_fpm_ini_dir }}/99-zabbix.ini"
zabbix_server_php_fastcgi: "unix//run/php/php{{ zabbix_server_php_version }}-fpm.sock"

zabbix_server_packages:
  - zabbix-server-mysql
  - zabbix-frontend-php
  - zabbix-sql-scripts
  - fonts-ipafont-gothic
  - "php{{ zabbix_server_php_version }}-fpm"
  - "php{{ zabbix_server_php_version }}-mysql"
  - "php{{ zabbix_server_php_version }}-gd"
  - "php{{ zabbix_server_php_version }}-bcmath"
  - "php{{ zabbix_server_php_version }}-mbstring"
  - "php{{ zabbix_server_php_version }}-xml"
  - "php{{ zabbix_server_php_version }}-ldap"

zabbix_server_web_root: /usr/share/zabbix
zabbix_server_caddy_config_dir: /etc/caddy
zabbix_server_caddyfile_path: "{{ zabbix_server_caddy_config_dir }}/Caddyfile"
zabbix_server_caddy_service_name: caddy

zabbix_server_disable_legacy_nginx: true
zabbix_server_legacy_nginx_config_path: /etc/nginx/conf.d/zabbix.conf
zabbix_server_legacy_nginx_service_name: nginx

zabbix_server_service_name: zabbix-server
zabbix_server_config_path: /etc/zabbix/zabbix_server.conf
zabbix_server_config_owner: root
zabbix_server_config_group: zabbix
zabbix_server_config_mode: "0640"
zabbix_server_frontend_font_source: /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf
zabbix_server_frontend_font_link: /usr/share/zabbix/assets/fonts/ipag.ttf
zabbix_server_frontend_font_dir: /usr/share/zabbix/assets/fonts
zabbix_server_frontend_defines_path: /usr/share/zabbix/include/defines.inc.php

zabbix_dbhost: localhost
mysql_login_unix_socket: /var/run/mysqld/mysqld.sock
mysql_zabbix_dbname: zabbix
mysql_zabbix_user: zabbix
zabbix_server_mysql_schema_path: /usr/share/zabbix-sql-scripts/mysql/server.sql.gz
zabbix_server_mysql_schema_min_trigger_count: 65
zabbix_server_recreate_partial_schema: false

zabbix_server_config_directives:
  - key: LogFile
    value: /var/log/zabbix/zabbix_server.log
  - key: LogFileSize
    value: "0"
  - key: PidFile
    value: /run/zabbix/zabbix_server.pid
  - key: SocketDir
    value: /run/zabbix
  - key: DBHost
    value: "{{ zabbix_dbhost }}"
  - key: DBName
    value: "{{ mysql_zabbix_dbname }}"
  - key: DBUser
    value: "{{ mysql_zabbix_user }}"
  - key: StartDiscoverers
    value: "3"
  - key: SNMPTrapperFile
    value: /var/log/snmptrap/snmptrap.log
  - key: Timeout
    value: "4"
  - key: FpingLocation
    value: /usr/bin/fping
  - key: Fping6Location
    value: /usr/bin/fping6
  - key: LogSlowQueries
    value: "3000"
  - key: StatsAllowedIP
    value: 127.0.0.1
