---
- name: Validate Zabbix server inputs
  ansible.builtin.include_tasks:
    file: preflight.yml
  when: not zabbix_server_preflight_completed | default(false)

- name: Install Zabbix server
  ansible.builtin.include_tasks:
    file: zabbix.yml

- name: Manage Zabbix database schema
  ansible.builtin.include_tasks:
    file: mysql.yml

- name: Setup PHP-FPM
  ansible.builtin.include_tasks:
    file: php-fpm.yml

- name: Setup Caddy
  ansible.builtin.include_tasks:
    file: caddy.yml

- name: Enable Zabbix server
  ansible.builtin.systemd_service:
    name: "{{ zabbix_server_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode
