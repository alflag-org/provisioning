---
- name: Gather service facts for legacy nginx
  ansible.builtin.service_facts:
  when:
    - zabbix_server_disable_legacy_nginx | bool
    - not ansible_check_mode

- name: Remove legacy Zabbix Nginx config
  ansible.builtin.file:
    path: "{{ zabbix_server_legacy_nginx_config_path }}"
    state: absent
  when: zabbix_server_disable_legacy_nginx | bool

- name: Stop and disable legacy nginx
  ansible.builtin.service:
    name: "{{ zabbix_server_legacy_nginx_service_name }}"
    state: stopped
    enabled: false
  when:
    - zabbix_server_disable_legacy_nginx | bool
    - not ansible_check_mode
    - ansible_facts.services.get(zabbix_server_legacy_nginx_service_name ~ '.service', {}) | length > 0

- name: Ensure Caddy config directory exists
  ansible.builtin.file:
    path: "{{ zabbix_server_caddy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Zabbix Caddyfile
  ansible.builtin.template:
    src: ./etc/caddy/Caddyfile.j2
    dest: "{{ zabbix_server_caddyfile_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload caddy

- name: Validate Zabbix Caddyfile
  ansible.builtin.command:
    cmd: "caddy validate --config {{ zabbix_server_caddyfile_path }}"
  changed_when: false
  when: not ansible_check_mode

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: "{{ zabbix_server_caddy_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode
