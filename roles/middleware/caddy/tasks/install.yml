---
- name: Install Caddy repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true

- name: Add Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types:
      - deb
    uris:
      - https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites:
      - any-version
    components:
      - main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    state: present

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
