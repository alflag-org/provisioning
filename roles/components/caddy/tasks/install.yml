---
- name: Install Caddy repository prerequisites
  ansible.builtin.include_role:
    name: apt_state
  vars:
    apt_state_packages:
      - ca-certificates
      - python3-debian

- name: Add Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types:
      - deb
    uris:
      - https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites:
      - any-version
    components:
      - main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    state: present
  register: caddy_repository

- name: Install Caddy
  ansible.builtin.include_role:
    name: apt_state
  vars:
    apt_state_packages: caddy
    apt_state_force_update_cache: "{{ caddy_repository.changed | default(false) }}"
