---
- name: Validate mysql-server inputs
  ansible.builtin.include_tasks:
    file: preflight.yml

- name: Install mysql-server
  ansible.builtin.include_tasks:
    file: install.yml

- name: Render mysql-server configuration
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ mysql_server_config_path }}"
    owner: "{{ mysql_server_config_owner }}"
    group: "{{ mysql_server_config_group }}"
    mode: "{{ mysql_server_config_mode }}"
  notify: Restart mysql
  when: mysql_server_manage_config | bool

- name: Apply pending mysql-server handlers
  ansible.builtin.meta: flush_handlers

- name: Read local MySQL state and secure writable instances
  ansible.builtin.include_tasks:
    file: secure.yml

- name: Manage mysql-server databases
  ansible.builtin.include_tasks:
    file: databases.yml
  when:
    - mysql_server_databases | length > 0
    - mysql_server_is_writable | bool

- name: Manage mysql-server users
  ansible.builtin.include_tasks:
    file: users.yml
  when:
    - mysql_server_users | length > 0
    - mysql_server_is_writable | bool

- name: Read MySQL component versions
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [/usr/sbin/mysqld, --version]
    - [/usr/bin/mysqlsh, --version]
  register: mysql_server_component_versions
  changed_when: false
  failed_when: >-
    mysql_server_component_versions.rc != 0 or
    not (mysql_server_component_versions.stdout is search('8[.]4[.]'))
  when: not ansible_check_mode
