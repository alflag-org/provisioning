---
- name: Inspect MySQL configuration directory
  ansible.builtin.stat:
    path: "{{ mysql_server_config_path | dirname }}"
  register: mysql_server_config_directory
  when: ansible_check_mode

- name: Render mysql-server configuration
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ mysql_server_config_path }}"
    owner: "{{ mysql_server_config_owner }}"
    group: "{{ mysql_server_config_group }}"
    mode: "{{ mysql_server_config_mode }}"
  notify: Restart mysql
  when: not ansible_check_mode or mysql_server_config_directory.stat.exists
