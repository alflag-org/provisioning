---
- name: Manage mysql-server users
  ansible.mysql.mysql_user:
    login_user: "{{ mysql_login_user }}"
    login_unix_socket: "{{ mysql_login_unix_socket }}"
    name: "{{ item.name }}"
    host: "{{ item.host | default(omit) }}"
    host_all: "{{ item.host_all | default(omit) }}"
    plugin: "{{ item.plugin | default(omit) }}"
    plugin_auth_string: "{{ item.plugin_auth_string | default(omit) }}"
    salt: "{{ item.salt | default(omit) }}"
    priv: "{{ item.priv | default(omit) }}"
    append_privs: "{{ item.append_privs | default(omit) }}"
    state: "{{ item.state | default('present') }}"
    update_password: "{{ item.update_password | default(omit) }}"
  loop: "{{ mysql_server_users }}"
  loop_control:
    label: "{{ item.name }}@{{ item.host | default('*') }}"
  no_log: true
  when: not ansible_check_mode
