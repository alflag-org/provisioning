---
mysql_router_package: mysql-router
mysql_router_client_package: mysql-client
mysql_router_service_name: mysqlrouter
mysql_router_system_user: mysqlrouter
mysql_router_system_group: mysqlrouter
mysql_router_config_path: /etc/mysqlrouter/mysqlrouter.conf
mysql_router_bootstrap_dir: /var/lib/mysqlrouter/bootstrap
mysql_router_bootstrap_config_path: "{{ mysql_router_bootstrap_dir }}/mysqlrouter.conf"
mysql_router_dynamic_state_path: "{{ mysql_router_bootstrap_dir }}/data/state.json"
mysql_router_apt_pin_path: /etc/apt/preferences.d/mysql-8.4
mysql_router_replicaset_name: mysql-shared
mysql_router_bootstrap_instance: mysql-shared01.srv.alflag.internal
mysql_router_bootstrap_port: 3306
mysql_router_admin_user: mysql_replicaset_admin
mysql_router_admin_password_var: mysql_replicaset_admin_password
mysql_router_monitor_user: zbx_router
mysql_router_monitor_password_var: mysql_zabbix_monitor_password
mysql_router_bind_address: 127.0.0.1
mysql_router_rw_port: 6446
mysql_router_ro_port: 6447
mysql_router_split_port: 6450
mysql_router_rw_socket: /run/mysqlrouter/mysql-rw.sock
mysql_router_ro_socket: /run/mysqlrouter/mysql-ro.sock
mysql_router_split_socket: /run/mysqlrouter/mysql-rw-split.sock
mysql_router_wait_for_my_writes: true
mysql_router_wait_for_my_writes_timeout: 1
mysql_router_status_program_path: /usr/local/libexec/mysql-router-status
mysql_router_monitor_config_path: /etc/zabbix/mysql-router.cnf
mysql_router_require_secondary: true
