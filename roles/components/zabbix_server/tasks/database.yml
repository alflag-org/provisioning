---
- name: Enable and start local PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ zabbix_server_postgresql_service_name }}"
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Create the local Zabbix PostgreSQL role
  community.postgresql.postgresql_user:
    name: "{{ zabbix_server_database_user }}"
    password: "{{ lookup('ansible.builtin.vars', zabbix_server_database_password_var) }}"
    role_attr_flags: LOGIN
    state: present
  become: true
  become_user: postgres
  no_log: true
  when: not ansible_check_mode

- name: Create the local Zabbix PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ zabbix_server_database_name }}"
    owner: "{{ zabbix_server_database_user }}"
    encoding: UTF-8
    template: template0
    state: present
  become: true
  become_user: postgres
  when: not ansible_check_mode

- name: Read PostgreSQL listen addresses
  community.postgresql.postgresql_query:
    db: postgres
    query: SELECT setting FROM pg_settings WHERE name = 'listen_addresses'
  become: true
  become_user: postgres
  register: zabbix_server_postgresql_listen_current
  changed_when: false
  when: not ansible_check_mode

- name: Restrict PostgreSQL to loopback interfaces
  community.postgresql.postgresql_query:
    db: postgres
    query: ALTER SYSTEM SET listen_addresses = '127.0.0.1, ::1'
  become: true
  become_user: postgres
  register: zabbix_server_postgresql_listen
  changed_when: true
  when:
    - not ansible_check_mode
    - zabbix_server_postgresql_listen_current.query_result[0].setting != '127.0.0.1, ::1'

- name: Restart PostgreSQL after loopback configuration
  ansible.builtin.systemd_service:
    name: "{{ zabbix_server_postgresql_service_name }}"
    state: restarted
  when:
    - not ansible_check_mode
    - zabbix_server_postgresql_listen.changed | default(false)

- name: Check whether the Zabbix schema exists
  community.postgresql.postgresql_query:
    db: "{{ zabbix_server_database_name }}"
    query: SELECT to_regclass('public.dbversion') IS NOT NULL AS ready
  become: true
  become_user: postgres
  register: zabbix_server_schema
  changed_when: false
  when: not ansible_check_mode

- name: Import the packaged Zabbix PostgreSQL schema
  ansible.builtin.shell: >-
    set -o pipefail &&
    /usr/bin/zcat {{ zabbix_server_schema_path | quote }} |
    /usr/bin/psql --single-transaction --set ON_ERROR_STOP=1 --file=- --dbname {{ zabbix_server_database_name | quote }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ zabbix_server_database_user }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - not zabbix_server_schema.query_result[0].ready | bool

- name: Verify the imported Zabbix schema
  community.postgresql.postgresql_query:
    db: "{{ zabbix_server_database_name }}"
    query: SELECT mandatory, optional FROM dbversion
  become: true
  become_user: postgres
  register: zabbix_server_schema_version
  changed_when: false
  when: not ansible_check_mode

- name: Require exactly one Zabbix schema version row
  ansible.builtin.assert:
    that:
      - zabbix_server_schema_version.rowcount == 1
    fail_msg: Local PostgreSQL does not contain a complete Zabbix schema.
  when: not ansible_check_mode
