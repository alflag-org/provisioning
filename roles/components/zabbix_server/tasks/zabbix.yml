---
- name: Install Zabbix repository package
  ansible.builtin.apt:
    deb: "{{ zabbix_server_repository_deb_url }}"
  when:
    - zabbix_server_manage_repository | bool
    - zabbix_server_repository_deb_url | length > 0
    - not ansible_check_mode

- name: Install Zabbix server packages
  ansible.builtin.apt:
    name: "{{ zabbix_server_packages }}"
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Check Zabbix server configuration file
  ansible.builtin.stat:
    path: "{{ zabbix_server_config_path }}"
  register: zabbix_server_config_file

- name: Validate Zabbix server configuration file exists
  ansible.builtin.assert:
    that:
      - zabbix_server_config_file.stat.exists
    fail_msg: >-
      Zabbix server configuration file {{ zabbix_server_config_path }} is
      missing. Verify the zabbix-server-mysql package installed successfully.
  when: not ansible_check_mode

- name: Configure Zabbix server directives
  ansible.builtin.lineinfile:
    path: "{{ zabbix_server_config_path }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: "{{ zabbix_server_config_owner }}"
    group: "{{ zabbix_server_config_group }}"
    mode: "{{ zabbix_server_config_mode }}"
  loop: "{{ zabbix_server_config_directives }}"
  notify: Restart Zabbix server
  when: not ansible_check_mode or zabbix_server_config_file.stat.exists

- name: Configure Zabbix server database password
  ansible.builtin.lineinfile:
    path: "{{ zabbix_server_config_path }}"
    regexp: "^#?\\s*DBPassword="
    line: "DBPassword={{ mysql_zabbix_password }}"
    owner: "{{ zabbix_server_config_owner }}"
    group: "{{ zabbix_server_config_group }}"
    mode: "{{ zabbix_server_config_mode }}"
  no_log: true
  notify: Restart Zabbix server
  when: not ansible_check_mode or zabbix_server_config_file.stat.exists

- name: Ensure Zabbix server configuration permissions
  ansible.builtin.file:
    path: "{{ zabbix_server_config_path }}"
    state: file
    owner: "{{ zabbix_server_config_owner }}"
    group: "{{ zabbix_server_config_group }}"
    mode: "{{ zabbix_server_config_mode }}"
  notify: Restart Zabbix server
  when: not ansible_check_mode or zabbix_server_config_file.stat.exists

- name: Check Zabbix frontend font directory
  ansible.builtin.stat:
    path: "{{ zabbix_server_frontend_font_dir }}"
  register: zabbix_server_frontend_font_dir_status

- name: Create Zabbix frontend font symbolic link
  ansible.builtin.file:
    src: "{{ zabbix_server_frontend_font_source }}"
    dest: "{{ zabbix_server_frontend_font_link }}"
    state: link
  notify: Restart Zabbix server
  when: >-
    not ansible_check_mode or
    zabbix_server_frontend_font_dir_status.stat.exists

- name: Check Zabbix frontend definitions file
  ansible.builtin.stat:
    path: "{{ zabbix_server_frontend_defines_path }}"
  register: zabbix_server_frontend_defines_file

- name: Configure Zabbix frontend graph font
  ansible.builtin.lineinfile:
    path: "{{ zabbix_server_frontend_defines_path }}"
    regexp: "^define\\('ZBX_GRAPH_FONT_NAME',.*$"
    line: "define('ZBX_GRAPH_FONT_NAME', 'ipag');"
  notify: Restart Zabbix server
  when: not ansible_check_mode or zabbix_server_frontend_defines_file.stat.exists
