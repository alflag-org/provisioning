---
- name: Restart Zabbix server
  ansible.builtin.systemd_service:
    name: "{{ zabbix_server_service_name }}"
    state: restarted
  when: not ansible_check_mode

- name: Restart Zabbix frontend
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - "{{ zabbix_server_php_fpm_service_name }}"
    - "{{ zabbix_server_nginx_service_name }}"
  when:
    - not ansible_check_mode
    - zabbix_server_php_fpm_service_name | default('') | length > 0
