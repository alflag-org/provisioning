---
- name: Validate physical backup inputs
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', mysql_backup_password_var, default='') | string | length > 0
    fail_msg: >-
      The physical backup account secret is missing.
    quiet: true

- name: Require separate production and local backup storage paths
  ansible.builtin.assert:
    that:
      - >-
        [mysql_backup_mysql_datadir, mysql_backup_repository_dir,
         mysql_backup_staging_dir, mysql_backup_restore_dir] | mysql_backup_paths_are_separate
    fail_msg: Production data, backup repository, staging and restore paths must be separate absolute directories.

- name: Install the physical backup tools
  ansible.builtin.import_tasks: install.yml

- name: Ensure physical backup directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ mysql_backup_config_dir }}"
      group: root
      mode: "0750"
    - path: "{{ mysql_backup_status_dir }}"
      # mysqld needs traversal; sensitive child directories remain owner-only.
      group: root
      mode: "0711"
    - path: "{{ mysql_backup_repository_dir }}"
      group: root
      mode: "0700"
    - path: "{{ mysql_backup_staging_dir }}"
      group: root
      mode: "0700"

- name: Render physical backup credentials
  ansible.builtin.template:
    src: mysql-backup.cnf.j2
    dest: "{{ mysql_backup_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render physical backup configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ mysql_backup_config_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Install physical backup programs
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: mysql-physical-backup.py
      dest: "{{ mysql_backup_program_path }}"
      mode: "0750"
    - src: mysql-restore-test.py
      dest: "{{ mysql_backup_restore_program_path }}"
      mode: "0750"

- name: Install shared local backup storage logic
  ansible.builtin.copy:
    src: mysql_backup_storage.py
    dest: "{{ item }}/mysql_backup_storage.py"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ [mysql_backup_program_path | dirname, mysql_backup_restore_program_path | dirname] | unique }}"

- name: Seed the backup status document when absent
  ansible.builtin.copy:
    content: |
      {
        "last_attempt": null,
        "last_success": null,
        "last_failure": null,
        "destination_backend": "local",
        "destination_target": {{ mysql_backup_repository_dir | to_json }},
        "destination_available": false,
        "duration": null,
        "backup_size": null,
        "backup_path": null,
        "source_node": "{{ inventory_hostname }}",
        "source_role": null,
        "storage_success": false,
        "local_validation_success": false,
        "prepare_success": false,
        "restore_test_success": false,
        "restore_test_timestamp": null
      }
    dest: "{{ mysql_backup_status_path }}"
    owner: root
    group: root
    mode: "0640"
    force: false

- name: Check for the MySQL AppArmor profile
  ansible.builtin.stat:
    path: /etc/apparmor.d/usr.sbin.mysqld
  register: mysql_backup_apparmor_profile

- name: Configure AppArmor access to the isolated restore directory
  ansible.builtin.template:
    src: apparmor-mysql-backup.j2
    dest: /etc/apparmor.d/local/usr.sbin.mysqld
    owner: root
    group: root
    mode: "0644"
  notify: Reload MySQL AppArmor profile
  when: mysql_backup_apparmor_profile.stat.exists

- name: Render the physical backup and topology lock units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: mysql-physical-backup.service.j2
      dest: "/etc/systemd/system/{{ mysql_backup_service_name }}"
    - src: mysql-physical-backup.timer.j2
      dest: "/etc/systemd/system/{{ mysql_backup_timer_name }}"
  notify: Reload systemd for MySQL backup

- name: Apply pending physical backup handlers
  ansible.builtin.meta: flush_handlers

- name: Manage the physical backup timer
  ansible.builtin.systemd_service:
    name: "{{ mysql_backup_timer_name }}"
    state: "{{ 'started' if mysql_backup_timer_enabled | bool else 'stopped' }}"
    enabled: "{{ mysql_backup_timer_enabled | bool }}"
    daemon_reload: true
  when: not ansible_check_mode
