---
- name: Read the physical backup service state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - "{{ mysql_backup_service_name }}"
  register: mysql_backup_service_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Inspect the shared backup and restore lock
  ansible.builtin.stat:
    path: "{{ mysql_backup_lock_path }}"
    follow: false
  register: mysql_backup_operation_lock

- name: Require a safe shared backup and restore lock file
  ansible.builtin.assert:
    that:
      - >-
        not mysql_backup_operation_lock.stat.exists
        or (mysql_backup_operation_lock.stat.isreg | default(false))
      - not (mysql_backup_operation_lock.stat.islnk | default(false))
    fail_msg: >-
      The shared MySQL backup and restore lock is not a safe regular file on
      {{ inventory_hostname }}.

- name: Probe the shared backup and restore lock
  ansible.builtin.command:
    argv:
      - /usr/bin/flock
      - --nonblock
      - "{{ mysql_backup_lock_path }}"
      - /usr/bin/true
  register: mysql_backup_operation_lock_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: mysql_backup_operation_lock.stat.exists

- name: Require idle MySQL backup and restore operations
  ansible.builtin.assert:
    that:
      - mysql_backup_service_state.rc in [3, 4]
      - >-
        not mysql_backup_operation_lock.stat.exists
        or (mysql_backup_operation_lock_probe.rc | default(1)) == 0
    fail_msg: >-
      Refusing the topology operation while backup or restore work is active on
      {{ inventory_hostname }}.
