---
- name: Install Prometheus
  ansible.builtin.include_role:
    name: apt_state
  vars:
    apt_state_packages: "{{ prometheus_package }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Ensure Prometheus owned directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - "{{ prometheus_rules_dir }}"
    - "{{ prometheus_file_sd_dir }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Check Prometheus config directory
  ansible.builtin.stat:
    path: "{{ prometheus_config_dir }}"
  register: prometheus_config_dir_stat
  when: prometheus_enabled | bool

- name: Check Prometheus rules directory
  ansible.builtin.stat:
    path: "{{ prometheus_rules_dir }}"
  register: prometheus_rules_dir_stat
  when: prometheus_enabled | bool

- name: Check Prometheus file service discovery directory
  ansible.builtin.stat:
    path: "{{ prometheus_file_sd_dir }}"
  register: prometheus_file_sd_dir_stat
  when: prometheus_enabled | bool

- name: Render Prometheus node target discovery
  ansible.builtin.template:
    src: node.json.j2
    dest: "{{ prometheus_node_exporter_file_sd_path }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode or prometheus_file_sd_dir_stat.stat.isdir | default(false)

- name: Render Prometheus blackbox HTTP target discovery
  ansible.builtin.template:
    src: blackbox_http.json.j2
    dest: "{{ prometheus_blackbox_http_file_sd_path }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode or prometheus_file_sd_dir_stat.stat.isdir | default(false)

- name: Read Prometheus node target discovery
  ansible.builtin.slurp:
    src: "{{ prometheus_node_exporter_file_sd_path }}"
  register: prometheus_node_target_discovery
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Parse Prometheus node target discovery
  ansible.builtin.set_fact:
    prometheus_node_target_records: "{{ prometheus_node_target_discovery.content | b64decode | from_json }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Require the expected number of Prometheus node targets
  ansible.builtin.assert:
    that:
      - prometheus_node_target_records | length >= prometheus_node_exporter_target_minimum | int
    fail_msg: >-
      Prometheus generated {{ prometheus_node_target_records | length }} node target(s),
      below prometheus_node_exporter_target_minimum={{ prometheus_node_exporter_target_minimum }}.
    quiet: true
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Validate Prometheus node target records
  ansible.builtin.assert:
    that:
      - item.targets | default([]) | length > 0
      - (item.labels | default({})).get('host', '') | length > 0
    quiet: true
  loop: "{{ prometheus_node_target_records }}"
  loop_control:
    label: "{{ (item.labels | default({})).get('host', '<missing>') }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Read Prometheus blackbox HTTP target discovery
  ansible.builtin.slurp:
    src: "{{ prometheus_blackbox_http_file_sd_path }}"
  register: prometheus_blackbox_http_target_discovery
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Parse Prometheus blackbox HTTP target discovery
  ansible.builtin.set_fact:
    prometheus_blackbox_http_target_records: "{{ prometheus_blackbox_http_target_discovery.content | b64decode | from_json }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Require the expected number of Prometheus blackbox HTTP targets
  ansible.builtin.assert:
    that:
      - prometheus_blackbox_http_target_records | length >= prometheus_blackbox_http_target_minimum | int
    fail_msg: >-
      Prometheus generated {{ prometheus_blackbox_http_target_records | length }} blackbox HTTP target(s),
      below prometheus_blackbox_http_target_minimum={{ prometheus_blackbox_http_target_minimum }}.
    quiet: true
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Validate Prometheus blackbox HTTP target records
  ansible.builtin.assert:
    that:
      - item.targets | default([]) | length > 0
      - item.targets | select('match', '^https?://') | list | length == item.targets | length
    quiet: true
  loop: "{{ prometheus_blackbox_http_target_records }}"
  loop_control:
    label: "{{ item.targets | default([]) | join(', ') }}"
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_path }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode or prometheus_config_dir_stat.stat.isdir | default(false)

- name: Render Prometheus alert rules
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ prometheus_rules_dir }}/monitoring.yml"
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode or prometheus_rules_dir_stat.stat.isdir | default(false)

- name: Validate Prometheus configuration
  ansible.builtin.command:
    argv:
      - "{{ prometheus_promtool_binary }}"
      - check
      - config
      - "{{ prometheus_config_path }}"
  changed_when: false
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Enable and start Prometheus
  ansible.builtin.service:
    name: "{{ prometheus_service_name }}"
    state: started
    enabled: true
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode

- name: Apply pending Prometheus handlers
  ansible.builtin.meta: flush_handlers
  when: prometheus_enabled | bool

- name: Validate Prometheus port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ prometheus_port }}"
    timeout: 10
    state: started
  when:
    - prometheus_enabled | bool
    - not ansible_check_mode
