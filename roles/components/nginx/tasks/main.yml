---
- name: Install nginx without starting the distribution default site
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
    policy_rc_d: 101
  become: true

- name: Ensure nginx service fragment directory exists
  ansible.builtin.file:
    path: "{{ nginx_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Only conf.d is imported. Package-owned sites-enabled entries are left untouched
# and inactive; services own their individual conf.d fragments.
- name: Render nginx base configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ nginx_binary }} -t -c %s"
  notify: nginx configuration changed

- name: Validate nginx configuration before starting
  ansible.builtin.import_tasks: validate.yml
  when: not ansible_check_mode

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true
  when: not ansible_check_mode
