---
# A failed validation stops handler execution before any reload can occur.
- name: Validate nginx before reload
  ansible.builtin.command:
    argv:
      - "{{ nginx_binary }}"
      - -t
      - -c
      - "{{ nginx_config_path }}"
  changed_when: false
  listen: nginx configuration changed
  when: not ansible_check_mode

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: "{{ nginx_service_name }}"
    state: reloaded
  listen: nginx configuration changed
  when: not ansible_check_mode
